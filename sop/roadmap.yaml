name: 路线图生成
version: "5.0"
description: 从差距分析出发，生成可执行的分阶段职业路线图。产品不规划时间——只定义顺序、产出与完成标准，节奏由用户掌握。分步产出 + 审计第二意见：起点判定→目标拆解→阶段序列→逐阶段细化→审计→定稿

methodology:
  principles:
    - "阶段类型决定产出：learn 打基础（通常无简历价值），project/intern/research 落简历（必须有 resume_value）"
    - "KPI 必须可量化——不能是「学会」这种模糊表述，要有数字、有证据；但不设定时限"
    - "不为任务标注天数或时长——用户的时间分配完全由用户自己决定，快慢都是正常的"
    - "里程碑必须有明确的完成标准（done_criteria），完成与否看标准不看日历"
    - "善于建议高价值活动：开源 PR、黑客马拉松、技术博客——这些都能归入 project 类型"
    - "知识光谱纪律：公司名与选人特点是公开常识，可直接写（如「某司卡学历」、「某司欢迎双非」）；
       但具体 JD 细节（岗位职责/技能要求/薪资）必须有真实数据支撑——企业数据源有的抓取，
       没有的引导用户导入，两者都没有就只写阶段目标与完成标准，绝不编造要求细节"
    - "起点决定路径：intern/过渡阶段优先从「进入该阶段时可进入的企业层级」出发；
       但层级是命中率参考，不是准入许可——跨级不禁止，请在阶段理由中说明证据（作品集/内推/前序交付）"
    - "分步产出，禁止一步到位：起点判定、目标拆解、阶段序列、逐阶段细化必须分步完成，
       每步产出中间产物并经用户/审计确认，避免把全部决策压缩进一次输出导致想当然"
    - "审计是第二意见，不是准入证：save_roadmap 只校验结构，质量项以 advisories 返回并持久化；
       审计输出 PASS / PASS_WITH_NOTES / FAIL，FAIL 只用于硬矛盾（编造 JD、无依据跨级、
       KPI 完全缺失、届别硬冲突、任务不可打卡），最多 3 条 must_fix，其余进 notes"

  phases:
    - id: gather_market_data
      name: 检索市场数据
      guidance: |
        按阶段类型决定取数范围，不为每个阶段都抓 JD：
        - learn / 自建 project / research：无需岗位数据（学什么由差距分析决定）
        - intern / 需要真实岗位依据的阶段：企业数据源有的用 fetch_company_jobs 抓同类岗位；
          企业数据源没有的请用户导入（import_jd_file）；两者都拿不到时，该阶段 jd 保持空、
          jd_status 置 pending_user_import，绝不凭记忆写岗位要求细节
        同时读取 gap.start_level，确定用户当前可进入的企业层级档位。
      data_needs:
        - type: job_requirements
          query_hint: "{target_role} {target_company} 岗位要求 技能"
          local_paths: ["jds/", "market/"]
        - type: start_level
          query_hint: "从 profile.gap.start_level 中获取"
          local_paths: []
      quality_gate: "intern 阶段要么有真实 JD 数据（has_jd），要么明确标记为待导入（pending_user_import），
      不存在既无数据又写了要求细节的阶段"

    - id: design_roadmap
      name: 设计路线图
      guidance: |
        按 6 步工作流分步产出，禁止一步到位。每一步有明确中间产物，步骤 1/3/6 需用户确认。

        【步骤 1｜起点判定】（用户确认）
        - 可用下方 start_level 打分表作为参考，但结果是「预估命中率」，不是投递许可
        - 等价证据（生产级系统交付、开源作品、内推、竞赛）同样计入，不要求必须有「大厂实习」
        - 输出：start_level（参考档位）+ 各维度依据 + 证据清单

        【步骤 2｜目标拆解】
        - 从 want/target_jd 提取目标角色与目标公司
        - 判断目标岗位需要哪些证据（项目/实习/开源/内推/技能），当前已经具备什么
        - 输出：目标角色 + 证据缺口 + 投递通道（校招/实习转正/内推/社招/开源等）

        【步骤 3｜阶段序列】（用户确认）
        - 按「补齐证据 → 提高命中率」设计阶段序列（learn → project → intern → ...）
        - 层级不是准入许可：跨级不禁止，但请在阶段理由中说明依据（作品集/内推/前序交付）
        - 复评升级（start_level_after）只影响后续阶段的参考，不写回差距分析；
          请写清复评标准（evidence_gate）
        - 每个阶段标注：类型、目标、需要补齐的证据（evidence_gate）、投递通道（access_path）、理由
        - 输出：完整阶段序列 + 每阶段一句话定位

        【步骤 4｜逐阶段细化】
        - 对每个阶段深入展开：
          - KPI：尽量可验证（投递数/进面数/PR 数/题数/覆盖率等）；任务层计数是建议，不强制
          - 里程碑：2-3 个，每个有明确完成标准（done_criteria）
          - 任务：粒度「一次坐下来可完成」，含 name/description/priority；
            时间节奏词与伞形描述只作建议提示，不再硬拒绝
          - jd 三件套：company/rationale（常识可写）+ jd/jd_status（真实数据才填）

        【步骤 5｜保存雏形 + 审计（第二意见）】
        - 先调用 save_roadmap(roadmap_json) 保存当前雏形（结构校验通过即可）
        - 再调 career-roadmap-auditor 按 audit_checklist 检查
        - 输出 PASS / PASS_WITH_NOTES / FAIL；FAIL 只用于硬矛盾，最多 3 条 must_fix
        - 调用 save_roadmap_audit 落库（按 roadmap_hash 绑定）；审计不阻断定稿
        - 需要修改时由 LLM 与用户决定，不做无界重审

        【步骤 6｜定稿】（用户确认）
        - 按需采纳审计建议与质量提示后，再次 save_roadmap(roadmap_json) 定稿
        - 一次性展示全流程雏形（所有阶段/目标/KPI/里程碑/顺序理由），用户确认
        - 保存后如实复述质量建议与审计未解决项

        阶段类型规范：
        - learn（学习技能）：刷题、学框架、考认证、看文档、跟教程。resume_value 通常为空。
          jd_status = not_required。
        - project（做项目）：独立项目、开源贡献、黑客马拉松、技术博客。必须有 resume_value。
          自建项目 jd_status = not_required。
        - intern（实习）：公司实习、远程实习、兼职。必须有 resume_value。
          company 可直接写具体公司名，并附 rationale（推荐理由，如「对双非友好」）；
          有真实 JD 数据时 jd 填要求细节、jd_status = has_jd；
          没有真实 JD 时 jd 保持空、jd_status = pending_user_import。
        - research（研究）：发论文、做课题、参与实验室项目。必须有 resume_value。
      data_needs:
        - type: gap_summary
          query_hint: "从 profile.gap 中获取（含 start_level）"
          local_paths: []
        - type: user_have
          query_hint: "从 profile 中获取"
          local_paths: []
        - type: user_want
          query_hint: "从 profile 中获取"
          local_paths: []
      quality_gate: "每个阶段有 KPI 和 resume_value（learn 类型除外），每个里程碑有完成标准，
      全程无时长字段；intern 阶段符合 jd 三件套约束（有据填 jd，无据占位）；
      通过 career-roadmap-auditor 审计（届别/层级/起点/前置/量化/jd 三件套）"
      depends_on: [gather_market_data]

  start_level_rubric:
    description: "start_level 判定打分表——逐维度打分后映射档位。维度分数 0-5，总分 = 加权和"
    dimensions:
      - name: education
        label: 学历档位
        description: "目标行业对学历的敏感度越高，权重越高"
        weight: 0.25
        levels:
          - score: 5
            desc: "目标行业主流院校（如计算机行业 985/211 或硕士+）"
          - score: 3
            desc: "目标行业认可院校（如双非一本但对口）"
          - score: 1
            desc: "专科/跨专业无相关背景"
      - name: internship
        label: 实习规模与时长
        description: "实习所在公司层级 × 时长，体现实际业务场景"
        weight: 0.30
        levels:
          - score: 5
            desc: "大厂实习 6 个月+，或中厂 12 个月+"
          - score: 4
            desc: "大厂实习 3-6 个月"
          - score: 3
            desc: "中厂实习 3-6 个月，或小厂实习 6 个月+"
          - score: 2
            desc: "小厂实习 3-6 个月"
          - score: 1
            desc: "小厂/无知名公司实习 3 个月以内"
          - score: 0
            desc: "无实习经历"
      - name: collaboration
        label: 团队协作经历
        description: "多人协作、代码评审、跨角色配合——大厂最看重的信号"
        weight: 0.15
        levels:
          - score: 5
            desc: "有团队协作 + 代码评审 + 跨角色沟通的完整证据"
          - score: 3
            desc: "有团队协作经历，但缺乏评审/沟通细节"
          - score: 1
            desc: "独立开发为主，无协作证据（负面信号）"
          - score: 0
            desc: "无任何团队项目经历"
      - name: skill_depth
        label: 技能深度
        description: "核心技能的 evidence/confidence 质量（用户确认而非简历字面）"
        weight: 0.20
        levels:
          - score: 5
            desc: "核心技能有用户确认的 evidence + 现场讲得出难点"
          - score: 3
            desc: "技能有 evidence 但未经用户逐项确认"
          - score: 1
            desc: "技能仅有简历字面，无证据"
      - name: project_complexity
        label: 项目复杂度
        description: "项目规模、技术深度、是否独立承担关键模块"
        weight: 0.10
        levels:
          - score: 5
            desc: "复杂系统/高并发/算法级，独立承担核心模块"
          - score: 3
            desc: "完整应用/项目，有明确用户或交付"
          - score: 1
            desc: "练习/教程级项目，无实际使用"
    mapping:
      - min: 4.0
        level: 大厂
      - min: 3.0
        max: 4.0
        level: 中厂
      - min: 2.0
        max: 3.0
        level: 小厂
      - min: 0.0
        max: 2.0
        level: 暂不可入
    usage: |
      逐维度打分后计算加权总分，按 mapping 映射参考档位。
      档位是「预估命中率」，不是投递许可——不要用「必须先有大厂经历才能投大厂」这类循环约束。
      等价证据（生产级系统交付、开源作品、内推、竞赛）可以替代实习/公司层级维度。
      层级跨度只作为建议：跨级时请说明依据（作品集/内推/前序交付），不禁止投递。
      分阶段爬升可选用 start_level_after 表达复评升级（只影响后续阶段参考，不写回差距分析）。
      负面信号（独立开发无协作/时长短/公司规模小）应在维度分中如实体现，但不因此剥夺投递机会。

  audit_checklist:
    description: "路线图审计清单（第二意见）——career-roadmap-auditor 逐项检查；
      审完调用 save_roadmap_audit 落库（verdict/issues/notes，按 roadmap_hash 绑定版本）。
      审计不阻断定稿；FAIL 只用于硬矛盾，最多 3 条 must_fix，其余进 notes"
    items:
      - id: start_alignment
        label: 起点对齐
        severity: note
        check: "起点档位与证据是否自洽；过度乐观时提示风险，不作为禁投依据"
      - id: level_continuity
        label: 层级参考
        severity: note
        check: "层级只作命中率参考：跨级时提示说明依据（作品集/内推/前序交付），不判违规；
              start_level_after 只影响后续阶段，不写回差距分析"
      - id: graduation_match
        label: 届别匹配
        severity: must
        check: "阶段面向届（graduation_year）与用户毕业届硬冲突（用户无法投递）才允许 FAIL"
      - id: prerequisite
        label: 前置补全
        severity: note
        check: "目标门槛较高时提示补强证据；没有前置阶段不直接判 FAIL"
      - id: quantifiable
        label: 量化与可执行
        severity: must
        check: "KPI 完全缺失或任务不可打卡才允许 FAIL；任务计数、伞形措辞、时间词只作建议"
      - id: jd_discipline
        label: jd 三件套
        severity: must
        check: "编造 JD 细节（无真实数据却写具体要求）才允许 FAIL；占位未确认只作提示"
      - id: phase_fields
        label: 阶段字段完备
        severity: note
        check: "target_level/graduation_year 等字段缺失只作提示；不因此阻断定稿"
    verdict:
      - pass: "全部通过 → PASS"
      - pass_with_notes: "无硬矛盾但有建议 → PASS_WITH_NOTES（可定稿，建议清单供参考）"
      - fail: "存在硬矛盾 → FAIL（最多 3 条 must_fix；其余进 notes）；仍可定稿，但须向用户明示风险"

  output_schema:
    strategy_summary: "整体策略说明（一段话）"
    start_level: "本次路线图的起点档位（大厂/中厂/小厂/暂不可入）——与差距分析判定交叉核对"
    phases: |
      阶段列表，每阶段包含：
      - type, name, goal（id 由系统自动生成，无需提供）
      - kpi: { metric, target, evidence }
      - resume_value: 如何写到简历上（learn 可空）
      - target_level: 可选。本阶段目标层级（大厂/中厂/小厂/暂不可入）——仅作命中率参考，
        不作为投递许可；跨级请在 rationale/condition 说明依据
      - access_path: 可选。投递通道（校招/实习转正/内推/社招/开源/外包转正/其他）——
        用于说明为什么该阶段可达，不参与硬校验
      - evidence_gate: 可选。进入该阶段前应具备的证据（项目/实习/开源/技能）——
        帮助 LLM 与审计员判断路径是否自洽，不要求逐项机器校验
      - start_level_after: 可选。本阶段复评达标后的参考起点（只影响后续阶段，不写回差距分析）
      - graduation_year: 可选（校招/实习阶段建议填）。本阶段面向的毕业届（整数）
      - condition: 可选。分支/备用路径说明（如「复评不达标则延长本阶段改投中厂」）——
        回退路径的表达方式，受审计支持
      - company: 实习/目标公司名（公开常识，可直接写）
      - rationale: 为什么推荐这家/这个方向（展示给用户的理由）
      - jd: 具体岗位要求细节——只有拿到真实 JD 数据（抓取/导入）才填
      - jd_status: has_jd | pending_user_import | not_required
      - confirmed: 用户已确认占位（占位阶段在用户确认后置 true）
      - milestones: { name, tasks[], deliverable, done_criteria }
      每个 task 包含：name, description, priority
      注意：不要输出任何 duration/total_duration/estimated_days 类字段；
      任务名禁伞形描述（专题/批量/全部）与时间节奏词（每周/每天）
