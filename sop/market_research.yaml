name: 市场调研
version: "1.0"
description: 建档后在分析前执行的独立一步：批量抓取真实 JD（目标 1 家 + 对照 2-4 家）与同学学历经历，产出带来源的报告落盘到用户资产目录——「来源真实」是产品核心卖点。

methodology:
  principles:
    - "来源真实是产品底线，也是核心卖点：每条数据必须带来源（平台/url/抓取时间/薪资填报源）；
      未获取到的内容明确写「未获取」并给出缺失原因，绝不凭 LLM 记忆编造或猜测"
    - "调研只采集事实，不做主观评价——「这是什么」归调研，「意味着什么、要不要紧」归差距分析；
      调研汇报里对数据的解读不超过一句，且必须可追溯到来源"
    - "JD 采样策略：目标公司 1 家（JD 全文口径）+ 同方向对照 2-4 家（优先同城、优先有薪资数据
      的源如 BOSS直聘）；对照公司选择要在播报里说明为什么选它们（客户名单来自数据源可用性，不是编的）"
    - "案例策略：用教育归一后的学历档（五档四层：985/211/双非/专科 × 博/硕/本/专 + 届别）
      搜同学学历成功经历与面试要求——search_cases 会按学历匹配度打分，双非本用户优先看到双非本案例"
    - "失败透明：任一源失败不中断调研，失败原因原样进报告的来源状态面板；「连失败都如实亮出」
      本身就是可信度的证明，不要为了好看而隐藏"
    - "落盘即完成：报告由代码渲染原始抓取数据生成（md + html + json 三件套），
      不经 LLM 手写——即使会话中断，事实已保存在用户资产目录调研报告/ 下"
    - "产物位置对用户可见：完成后必须报出 index.html 入口路径与本次报告文件名，
      提示「每条都带来源链接，点开可验证」；路径来自工具返回，不得口胡"
    - "报告生成前主动播报范围与预计时长（约半分钟），让用户可随时喊停或增减对照公司"

  phases:
    - id: scope_declare
      name: 范围宣告
      guidance: |
        从档案 want/target_jd/who 提取：目标岗位方向、目标公司（可选）、城市、学历档。
        向用户播报调研菜单（不阻塞，给叫停机会）：
        - 将抓取：目标公司 JD 1 份全文 + 同方向对照岗位 2-4 家 + 同学历成功经历若干条
        - 预计耗时约半分钟；完成后报告落盘到 ~/CareerKit/<档案名>/调研报告/
        - 例：「我现在按你的目标（AI Agent 开发 · 北京 · 双非本）抓市场：字节 1 家全文 +
          BOSS 同城对照 3 家 + 双非本上岸案例，约半分钟，完成后报告存到你的 CareerKit
          资产夹，不想抓哪家随时喊停」
      data_needs:
        - type: user_profile
          query_hint: "want（方向/公司/城市）与 who（学历/届别）"
          local_paths: []
      quality_gate: "用户听到了抓什么、多久、产出在哪；有异议即调整范围"

    - id: bulk_gather
      name: 批量抓取
      guidance: |
        一次调用 gather_research_data 完成（不得散抓多轮）：
        - jd_specs：目标公司 1 条（有官方源进官方源）+ 对照 2-4 条（BOSS/官方可用源，
          优先同城同岗位方向）
        - case_query：role=目标方向；education=学历档（五档四层写法，如「双非本」）；
          company/city 可选
        - 任一源失败不中断；工具会把 source_status（成功/失败/条数/耗时）返回
      data_needs:
        - type: job_market
          query_hint: "gather_research_data(jd_specs, case_query)"
          local_paths: []
      quality_gate: "至少 1 个源成功返回数据；全部失败时如实告知并引导 import_jd / 手头材料"

    - id: report_and_link
      name: 报告落地与汇报
      guidance: |
        报告由工具自动落盘三件套（md/html/json）并更新档案与 index。
        向用户汇报（工具返回摘要为基础，补充一两句解读）：
        - 拿到了什么：X 条岗位样本（含薪资）、Y 条同学学历经历、Z 个源可用、W 个源失败
        - 报告在哪：完整路径 + 「双击 index.html 总览所有资产」
        - 来源可信：每条带来源链接，点开可验证；没抓到的写了「未获取」
        - 下一步：以这份调研做差距分析（第 3 步），说开始就走
      data_needs: []
      quality_gate: "用户拿到路径与样本数；对失败源与缺口有知情"

output_schema:
  report_files:
    - md: "调研报告/<日期_方向>.md——可读全文，来源链接可点"
    - html: "调研报告/<日期_方向>.html——阅读版，报告底部可返回资产中心"
    - json: "调研报告/<日期_方向>.json——结构化原始数据"
  entry: "index.html（资产根）——全部产出的总入口，每次生成后自动刷新"
  jd_sample_fields: [公司, 岗位, 地点, 薪资, 要求摘要, 来源, url, 抓取时间]
  case_fields: [标题, 学历标签, 届别, 路径摘要, 来源, url, 日期, 匹配分]
  source_status_fields: [源, 状态(成功/失败/为空), 条数, 耗时, 失败原因]
  gaps_fields: [未获取内容, 原因, 建议补充方式]
