# 企业 JD Scraper 注册表
#
# 添加新企业：
# 1. 在 scrapers/ 下新建目录，实现 CompanyScraper（含 PARAMS 类属性和 guide.md）
# 2. 在此文件注册（只需以下字段）
# 3. PR 提交
#
# 字段说明：
#   name: 企业名称（显示用）
#   module: Python 模块路径（相对于 src/scrapers/）
#   class: Scraper 类名（默认 Scraper）
#   description: 企业描述（可选，一句话说明数据类型和特点）
#   url_patterns: 域名列表，用于 fetch_jd_detail 的 URL 自动路由
#
# 注意：搜索参数不再在此定义——以各 scraper 类的 PARAMS 类属性为唯一事实源，
# list_data_sources 会自动读取并渲染给 LLM。

scrapers:
  boss:
    name: BOSS直聘
    module: boss.scraper
    class: Scraper
    description: BOSS直聘（zhipin.com），需要首次登录后缓存登录态，岗位含明确薪资范围
    url_patterns:
      - "zhipin.com"

