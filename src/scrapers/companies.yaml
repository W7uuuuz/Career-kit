# 企业目录——档位、行业与 scraper 映射的唯一事实源。
#
# 与 config.yaml 的分工：
# - config.yaml：scraper 实现注册表（module/class/url_patterns/description）
# - companies.yaml：企业元数据（名称、档位、行业、别名、可用的 scraper）
#
# 没有 scraper 的企业也保留在目录里：投递清单会标注「未接入自动抓取」，
# 用户仍可手动投递；后续补充 scraper 时只需在本文件把 scrapers 填上。
#
# 档位口径（与 docs/rules.md 一致）：
# - 大厂：一线互联网与大型科技/制造企业
# - 中厂：垂直领域头部、上市中型公司、成熟独角兽
# - 小厂：创业公司、中小型公司、外包与早期团队（当前不预置，可由用户补充）

