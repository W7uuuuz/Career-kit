description: >-
  覆盖集成电路设计、晶圆制造、半导体设备与材料、封装测试、通信设备与网络、
  光通信、消费电子与硬件、PCB/连接器等方向。以电子信息工程、电子科学与技术、
  微电子科学与工程、集成电路设计与集成系统、通信工程、光电信息科学与工程、
  自动化、计算机等专业为主要人才来源。

