subdirections:
  - id: ic_design
    name: 芯片设计
    description: 数字、模拟、射频、验证和后端，做芯片从规格到流片的设计与验证。
  - id: manufacturing
    name: 晶圆制造/工艺
    description: 晶圆厂工艺、设备、良率和产线，做芯片制造过程的稳定与优化。
  - id: equipment_materials
    name: 半导体设备/材料
    description: 刻蚀、薄膜、光刻、清洗等设备，以及硅片、光刻胶、靶材等材料。
  - id: packaging_test
    name: 封装/测试
    description: 封装方案、量产测试、可靠性和失效分析，做芯片交付前的最后一环。
  - id: communication
    name: 通信设备/网络
    description: 基站、核心网、路由交换、网络规划和优化，支撑运营商与政企网络。
  - id: optical
    name: 光通信/光电
    description: 光模块、光纤光缆、光器件和光电系统，支撑数据中心与通信网络。
  - id: consumer_hardware
    name: 消费电子/硬件
    description: 手机、可穿戴、AI 硬件、智能家居等整机与板级硬件、嵌入式系统。
  - id: pcb_component
    name: PCB/电子元器件
    description: PCB、连接器、被动器件、传感器等电子元器件的设计、选型和可靠性。

