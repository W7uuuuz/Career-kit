roles:
  - id: digital_ic
    name: 数字IC设计/验证工程师
    summary: 做芯片数字前端设计、验证、综合与时序收敛，把规格变成可流片的 RTL。
    day_to_day:
      - 写 RTL、搭验证环境、跑仿真和覆盖率
      - 做综合、时序分析、功耗分析和后端交付
      - 和算法、软件、后端、测试团队一起定位问题
    entry: 电子信息、微电子、集成电路、计算机等本科及以上；设计岗硕士更常见，验证/后端本科有机会。
    skills:
      - 数字电路、计算机体系结构
      - Verilog/SystemVerilog、UVM
      - EDA 工具、Python/Tcl 脚本
    growth: 初级设计/验证 → 高级 → 资深/架构/技术管理。
    fit_signals:
      - 喜欢逻辑推理和细节调试
      - 能接受长周期流片和反复验证
      - 愿意读英文文档和规范
    dealbreakers:
      - 排斥代码、仿真和长时间调试
      - 只想做上层软件、不愿碰硬件和时序
    keywords:
      - 数字IC设计
      - 数字IC验证
      - SoC设计
      - IC验证

  - id: analog_rf_ic
    name: 模拟/射频IC工程师
    summary: 做模拟、混合信号、射频电路的设计、仿真、版图和测试。
    day_to_day:
      - 设计运放、电源、PLL、ADC/DAC、射频前端等电路
      - 做前仿真、后仿真、版图指导和测试调试
      - 和工艺、版图、系统、测试团队一起闭环
    entry: 微电子、集成电路、电子科学与技术等；模拟/射频岗硕士更常见。
    skills:
      - 模拟电路、CMOS 工艺、电磁场与射频基础
      - Cadence/ADS/HSPICE 等工具
      - 版图、测试仪器和数据分析
    growth: 设计工程师 → 高级 → 资深/架构/技术专家。
    fit_signals:
      - 喜欢电路、物理和实验
      - 有耐心做仿真、版图和测试迭代
      - 能接受长学习曲线
    dealbreakers:
      - 排斥模拟电路、版图和实验室
      - 只想做数字或纯软件
    keywords:
      - 模拟IC设计
      - 射频IC
      - 模拟电路
      - 版图设计

  - id: process_equipment
    name: 半导体工艺/设备工程师
    summary: 做晶圆制造工艺、设备维护、良率提升和产线异常处理。
    day_to_day:
      - 调工艺参数、维护设备、处理产线异常
      - 做良率分析、SPC 和实验验证
      - 和研发、制造、设备、材料供应商协作
    entry: 微电子、材料、物理、化学、机械、自动化等；制造/设备岗本科常见。
    skills:
      - 半导体工艺与器件基础
      - 设备原理、数据分析、SPC
      - 洁净室规范和安全意识
    growth: 工艺/设备工程师 → 高级 → 专家/产线管理。
    fit_signals:
      - 能接受洁净室、倒班和工厂环境
      - 动手能力强，重视流程和细节
      - 愿意长期积累工艺和设备经验
    dealbreakers:
      - 完全不能接受倒班、无尘服或厂区
      - 只想坐办公室做纯设计
    keywords:
      - 工艺工程师
      - 设备工程师
      - 半导体工艺
      - 晶圆制造

  - id: packaging_test
    name: 封装/测试工程师
    summary: 做芯片封装方案、量产测试、良率与失效分析，保证芯片可交付。
    day_to_day:
      - 做封装设计、测试程序开发和 ATE 调试
      - 分析良率、失效和可靠性问题
      - 和设计、工艺、封测厂、客户一起闭环
    entry: 微电子、电子、材料、机械等；封测岗本科常见。
    skills:
      - 封装工艺、测试原理、ATE
      - 数据分析、失效分析和可靠性
      - 跨厂协作和问题闭环
    growth: 工程师 → 高级 → 专家/封测管理。
    fit_signals:
      - 喜欢动手、测试和数据分析
      - 能接受工厂和产线节奏
      - 对良率和可靠性有兴趣
    dealbreakers:
      - 排斥产线、测试设备和重复验证
      - 只想做纯设计
    keywords:
      - 封装工程师
      - 测试工程师
      - 芯片测试
      - 失效分析

  - id: hardware_embedded
    name: 硬件/嵌入式工程师
    summary: 做板级硬件、嵌入式软件、驱动和系统联调，把芯片用到产品里。
    day_to_day:
      - 画原理图、PCB，做板级调试和 EMC
      - 写嵌入式软件、驱动和测试程序
      - 和芯片、结构、软件、测试团队联调
    entry: 电子信息、通信、自动化、计算机等；本科常见，项目和作品重要。
    skills:
      - 模电、数电、PCB 设计
      - C/C++、单片机/ARM、RTOS
      - 示波器、逻辑分析仪和调试
    growth: 硬件/嵌入式工程师 → 高级 → 系统/技术管理。
    fit_signals:
      - 喜欢动手做板子和调试
      - 愿意软硬结合、贴近产品
      - 能接受项目节奏和现场问题
    dealbreakers:
      - 只想纯软件、不愿碰硬件和仪器
      - 排斥焊接、调试和现场
    keywords:
      - 硬件工程师
      - 嵌入式工程师
      - PCB设计
      - 驱动开发

  - id: communication_network
    name: 通信/网络工程师
    summary: 做通信设备、网络规划优化、协议和系统集成，支撑运营商与政企网络。
    day_to_day:
      - 做网络规划、设备调试和协议分析
      - 做无线/传输网络优化和故障处理
      - 支持客户、项目和现场交付
    entry: 通信工程、电子信息、计算机等；运营商、设备商、集成商均有入口。
    skills:
      - 通信原理、网络协议、TCP/IP
      - 无线/光传输/路由交换
      - 数据分析和客户沟通
    growth: 工程师 → 高级 → 专家/项目管理。
    fit_signals:
      - 喜欢网络与系统、逻辑清晰
      - 能接受出差和现场支持
      - 愿意和客户、运营商打交道
    dealbreakers:
      - 排斥出差、现场和客户沟通
      - 只想做纯研发
    keywords:
      - 通信工程师
      - 网络工程师
      - 无线优化
      - 通信协议

  - id: optical
    name: 光通信/光电工程师
    summary: 做光模块、光纤光缆、光器件和光电系统的设计、测试与工艺。
    day_to_day:
      - 做光路设计、器件测试和工艺开发
      - 做可靠性验证和失效分析
      - 和芯片、硬件、客户、产线协作
    entry: 光电信息、通信、电子、物理等；光模块、光纤光缆、光器件企业。
    skills:
      - 光学、光电子、光纤通信
      - 光路搭建、测试和数据分析
      - 工艺和可靠性基础
    growth: 工程师 → 高级 → 专家/技术管理。
    fit_signals:
      - 对光学、光通信有兴趣
      - 能接受实验室和产线
      - 愿意做测试和工艺细节
    dealbreakers:
      - 排斥光学实验、产线和重复测试
      - 只想做纯软件
    keywords:
      - 光通信工程师
      - 光模块
      - 光电工程师
      - 光纤

  - id: pcb_component
    name: PCB/电子元器件工程师
    summary: 做 PCB 设计、电子元器件选型、可靠性和供应链技术支持。
    day_to_day:
      - 做 PCB 设计、器件选型和 BOM 管理
      - 做可靠性测试、失效分析和供应商对接
      - 支持产品、采购、质量和客户
    entry: 电子、材料、机械等；消费电子、PCB、元器件企业。
    skills:
      - 电路基础、PCB 设计、器件知识
      - 可靠性、失效分析和数据分析
      - 跨部门沟通和供应链协作
    growth: 工程师 → 高级 → 专家/产品/供应链管理。
    fit_signals:
      - 喜欢产品细节和硬件
      - 愿意和供应链、客户打交道
      - 能接受多项目并行
    dealbreakers:
      - 排斥重复性工作和跨部门沟通
      - 只想做纯研发
    keywords:
      - PCB工程师
      - 电子元器件
      - 器件工程师
      - 可靠性

