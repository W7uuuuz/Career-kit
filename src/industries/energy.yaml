id: energy
name: 能源动力行业
status: supported
aliases:
  - 能源
  - 动力
  - 能源动力
  - 能源与动力
  - 能动
  - 电力
  - 发电
  - 新能源
  - 暖通
  - 制冷
description: >-
  覆盖发电、电力、新能源、储能、热力暖通、制冷、汽车动力、船舶航空动力、
  能源管理与设备制造。以能源与动力工程、新能源、储能、电气、机械、车辆、
  建环等专业为主要人才来源。

related_majors:
  core:
    - 能源与动力工程
    - 新能源科学与工程
    - 储能科学与工程
    - 能源科学与工程
  adjacent:
    - 电气工程及其自动化
    - 机械设计制造及其自动化
    - 车辆工程
    - 建筑环境与能源应用工程
    - 核工程与核技术
    - 材料科学与工程

major_aliases:
  能动: 能源与动力工程
  能源: 能源与动力工程
  能源动力: 能源与动力工程
  新能源: 新能源科学与工程
  储能: 储能科学与工程
  建环: 建筑环境与能源应用工程
  电气: 电气工程及其自动化
  车辆: 车辆工程
  机械: 机械设计制造及其自动化

subdirections:
  - id: power
    name: 电力/发电
    description: 火电、水电、核电、发电集团与电力设备，做发电系统的运行、维护和工程。
  - id: new_energy
    name: 新能源/储能
    description: 风电、光伏、储能、氢能，做资源评估、系统设计、并网和运维。
  - id: hvac
    name: 热力/暖通/制冷
    description: 供热、空调、制冷、建筑节能，做负荷计算、设备选型和工程设计。
  - id: mobility
    name: 汽车/动力/船舶航空
    description: 发动机、动力总成、电池热管理、船舶和航空动力系统。
  - id: management
    name: 能源管理/设备制造
    description: 节能诊断、能源审计、双碳咨询，以及锅炉、汽轮机、压缩机等设备研发与技术支持。

roles:
  - id: power_plant
    name: 电厂运行/运维
    summary: 保障发电设备安全稳定运行，处理监盘、巡检、操作和故障。
    day_to_day:
      - 监盘、巡检、倒班和运行操作
      - 处理设备异常，配合检修和技改
      - 执行安全规程和运行记录
    entry: 能源与动力工程、电气、自动化等专业常见；电厂校招，部分岗位需要倒班。
    skills:
      - 热力、流体、电气和设备基础
      - 安全规程、运行操作和故障判断
      - 倒班协作和现场沟通
    growth: 巡检/副值 → 主值 → 值长/专业工程师 → 电厂管理。
    fit_signals:
      - 能接受倒班和厂区工作环境
      - 重视稳定、动手能力强
      - 愿意长期积累设备和系统经验
    dealbreakers:
      - 完全不能接受倒班或偏远厂区
      - 只想在核心城市写字楼工作
    keywords:
      - 电厂运行
      - 集控运行
      - 发电运行

  - id: hvac
    name: 热力/暖通工程师
    summary: 做供热、空调、制冷和建筑节能的方案、设计与现场配合。
    day_to_day:
      - 负荷计算、设备选型和图纸设计
      - 跟设计院、施工方和设备厂配合
      - 处理现场问题、优化能耗
    entry: 建环、能源与动力工程等专业常见；设计院、设备厂、工程公司均有入口。
    skills:
      - 传热、流体、热力系统基础
      - CAD、负荷计算和设计规范
      - 现场沟通和工程问题处理
    growth: 设计/技术工程师 → 专业负责人 → 项目负责人。
    fit_signals:
      - 喜欢工程细节和规范
      - 能接受画图、改图和现场配合
      - 对建筑节能、热泵、空调系统有兴趣
    dealbreakers:
      - 讨厌图纸、规范和重复修改
      - 不愿意去现场
    keywords:
      - 暖通工程师
      - 热力工程师
      - 制冷工程师

  - id: new_energy
    name: 新能源/储能工程师
    summary: 做风电、光伏、储能系统的方案、选型、并网和运维。
    day_to_day:
      - 资源评估、系统方案和设备选型
      - 现场踏勘、并网调试和数据分析
      - 跟项目、设备和电网侧配合
    entry: 新能源、能源与动力、电气等专业常见；项目制岗位较多，可能需要出差。
    skills:
      - 新能源系统、电力电子或热管理基础
      - 数据分析、仿真和工程软件
      - 项目沟通和现场问题处理
    growth: 工程师 → 项目经理 → 技术/项目负责人。
    fit_signals:
      - 对新能源、双碳和项目现场有兴趣
      - 能接受出差和项目节奏
      - 愿意同时懂技术、设备和业务
    dealbreakers:
      - 只想坐办公室、完全不能出差
      - 对项目制波动很排斥
    keywords:
      - 新能源工程师
      - 储能工程师
      - 光伏系统工程师

  - id: thermal
    name: 电池热管理工程师
    summary: 做新能源汽车/储能电池的热管理方案、仿真、测试和问题定位。
    day_to_day:
      - 热仿真、方案设计和零部件选型
      - 台架/整车测试与数据分析
      - 定位热失控、温差、能耗等问题
    entry: 能源与动力、车辆、机械等专业常见；车企、电池厂和热管理供应商。
    skills:
      - 传热、流体和热系统基础
      - CFD/热仿真、测试和数据处理
      - 跨部门协作和问题闭环
    growth: 工程师 → 高级工程师 → 热管理专家/技术负责人。
    fit_signals:
      - 喜欢仿真和实验结合
      - 能接受车企项目节奏
      - 对电池、热安全和能效有兴趣
    dealbreakers:
      - 不愿意做仿真、测试或现场问题
      - 排斥制造业项目节奏
    keywords:
      - 热管理工程师
      - 电池热管理
      - 热仿真

  - id: powertrain
    name: 动力系统工程师
    summary: 做发动机、动力总成、船舶/航空动力的性能、标定和测试。
    day_to_day:
      - 性能开发、标定和台架测试
      - 分析故障、优化效率和排放
      - 跟整车、零部件和试验团队配合
    entry: 能源与动力、车辆、船舶等专业常见；车企、动力企业、院所。
    skills:
      - 内燃机/热力/机械基础
      - 测试、标定和数据分析
      - 现场试验和问题分析
    growth: 工程师 → 主任工程师 → 技术专家。
    fit_signals:
      - 喜欢机械、动力和动手试验
      - 能接受试验现场和项目周期
      - 对传统动力或混动仍有兴趣
    dealbreakers:
      - 排斥制造业和试验现场
      - 只想做纯软件/纯算法
    keywords:
      - 动力系统工程师
      - 发动机工程师
      - 动力总成

  - id: energy_management
    name: 能源管理/咨询
    summary: 做节能诊断、能源审计、双碳咨询和能源系统优化。
    day_to_day:
      - 收集能耗数据、做分析和诊断
      - 写报告、做方案和客户汇报
      - 跟设备、工程和客户团队配合
    entry: 能源、环境、工程管理等背景常见；咨询公司、节能服务公司、企业能源岗。
    skills:
      - 能源系统和能耗分析
      - 数据分析、报告写作和沟通
      - 政策/标准理解和项目推进
    growth: 顾问/工程师 → 项目经理 → 业务/技术负责人。
    fit_signals:
      - 喜欢分析、写报告和客户沟通
      - 能接受出差和项目制
      - 对节能、双碳和政策有兴趣
    dealbreakers:
      - 不喜欢写报告或客户沟通
      - 只想做纯技术、不愿接触业务
    keywords:
      - 能源管理
      - 节能工程师
      - 双碳咨询

  - id: equipment
    name: 设备研发/技术支持
    summary: 做锅炉、汽轮机、压缩机、制冷设备等的研发、选型和售前售后。
    day_to_day:
      - 设备设计、选型和测试
      - 支持销售、客户和现场调试
      - 处理质量问题和产品改进
    entry: 能源与动力、机械等专业常见；设备制造企业。
    skills:
      - 热力/机械基础和 CAD
      - 产品测试、故障分析和客户沟通
      - 现场服务意识
    growth: 研发/技术工程师 → 产品经理/技术经理。
    fit_signals:
      - 喜欢产品、设备和现场结合
      - 能接受出差和客户沟通
      - 愿意从技术走向产品/服务
    dealbreakers:
      - 不愿出差或面对客户
      - 只想做纯理论研究
    keywords:
      - 设备研发
      - 技术支持
      - 制冷设备

benchmarks:
  - label: 2025 届本科毕业生平均月收入
    value: 6435
    unit: 元/月
    source: 麦可思《2026年中国大学生就业报告》
    url: https://www.yicai.com/news/103232354.html
    note: 全国本科整体参考，不是能源动力行业单独统计。
  - label: 能源与动力工程毕业半年后平均月收入
    value: 7199
    unit: 元/月
    source: 麦可思《2026年中国大学生就业报告》
    url: https://news.eol.cn/guancha/202606/t20260623_2747692.shtml
    note: 2025 届该专业均值，仅作专业基准，不代表具体岗位或学校。
