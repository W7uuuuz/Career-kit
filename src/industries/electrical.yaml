subdirections:
  - id: power_equipment
    name: 电力设备/成套
    description: 变压器、开关、成套柜、电缆等输配电设备的设计、制造和选型。
  - id: power_electronics
    name: 电力电子/驱动
    description: 变频器、逆变器、电源、电机驱动等电力电子产品和硬件。
  - id: automation_control
    name: 自动化/控制
    description: PLC、DCS、运动控制、产线自动化和系统集成。
  - id: building_electrical
    name: 供配电/建筑电气
    description: 负荷计算、配电设计、照明、防雷接地和电气安全。
  - id: testing_certification
    name: 测试/认证
    description: 电气产品测试、认证、可靠性和实验室管理。
  - id: field_service
    name: 现场调试/售后
    description: 电气设备安装、调试、故障处理和客户支持。
  - id: smart_grid
    name: 智能电网/继保
    description: 电网自动化、继电保护、智能电表和配电自动化。

