roles:
  - id: electrical_design
    name: 电气设计工程师
    summary: 做电气系统、成套设备、原理图和选型设计。
    day_to_day:
      - 做电气原理图、柜体布置和器件选型
      - 做负荷计算、短路校验和规范符合性
      - 跟项目、现场、供应商和客户配合
    entry: 电气工程及其自动化、自动化等本科常见；设备厂、设计院、工程公司。
    skills:
      - 电气原理、低压电器、供配电
      - CAD/EPLAN、PLC、设计规范
      - 现场配合和问题处理
    growth: 设计工程师 → 高级 → 专业负责人/项目经理。
    fit_signals:
      - 喜欢电气系统和图纸
      - 能接受现场配合和项目节奏
      - 愿意积累规范和产品经验
    dealbreakers:
      - 排斥图纸、规范和现场
      - 只想做纯软件
    keywords:
      - 电气设计
      - 电气工程师
      - 成套设计
      - EPLAN

  - id: power_electronics
    name: 电力电子/硬件工程师
    summary: 做变频器、逆变器、电源、电机驱动等电力电子产品和硬件。
    day_to_day:
      - 做拓扑选择、器件选型和原理图/PCB
      - 做硬件调试、测试和问题定位
      - 和软件、控制、测试、客户协作
    entry: 电气、自动化、电子信息等本科常见；新能源、工控、电源企业。
    skills:
      - 电力电子、模电数电、PCB
      - 控制基础、测试仪器、数据分析
      - 硬件调试和问题闭环
    growth: 硬件工程师 → 高级 → 技术专家/项目经理。
    fit_signals:
      - 喜欢电路、硬件和调试
      - 能接受实验、测试和项目节奏
      - 对新能源、驱动、电源有兴趣
    dealbreakers:
      - 排斥硬件、实验和调试
      - 只想做纯软件或纯算法
    keywords:
      - 电力电子
      - 硬件工程师
      - 变频器
      - 逆变器

  - id: automation_control
    name: 自动化/控制工程师
    summary: 做 PLC、DCS、运动控制、产线自动化和系统集成。
    day_to_day:
      - 做控制方案、PLC 编程和组态
      - 做产线调试、优化和故障处理
      - 跟工艺、设备、客户和项目团队协作
    entry: 自动化、电气、控制等本科常见；制造、能源、工程公司。
    skills:
      - PLC/DCS、控制理论、电气基础
      - 组态、运动控制、现场调试
      - 项目沟通和问题闭环
    growth: 控制工程师 → 高级 → 项目经理/技术管理。
    fit_signals:
      - 喜欢控制和现场调试
      - 能接受出差和项目节奏
      - 愿意和工艺、设备打交道
    dealbreakers:
      - 排斥现场、编程和出差
      - 只想做纯设计
    keywords:
      - 自动化工程师
      - 控制工程师
      - PLC
      - DCS

  - id: building_electrical
    name: 供配电/建筑电气工程师
    summary: 做供配电、建筑电气、照明、防雷接地和电气安全。
    day_to_day:
      - 做负荷计算、配电设计和图纸
      - 做照明、防雷接地和电气安全校验
      - 跟设计院、施工方、设备和客户配合
    entry: 电气工程及其自动化、建筑电气与智能化等本科常见；设计院、工程公司、地产。
    skills:
      - 供配电、建筑电气、负荷计算
      - CAD、设计规范、电气安全
      - 现场配合和图纸会审
    growth: 设计工程师 → 高级 → 专业负责人/项目经理。
    fit_signals:
      - 喜欢规范和工程细节
      - 能接受图纸、现场和多方沟通
      - 对建筑、基础设施有兴趣
    dealbreakers:
      - 排斥图纸、规范和现场
      - 只想做产品研发
    keywords:
      - 供配电
      - 建筑电气
      - 电气设计
      - 配电工程师

  - id: testing_certification
    name: 电气测试/认证工程师
    summary: 做电气产品测试、认证、可靠性和实验室管理。
    day_to_day:
      - 做测试方案、仪器操作和数据采集
      - 做认证、可靠性、EMC 和报告
      - 跟研发、质量、客户和实验室协作
    entry: 电气、自动化、电子信息等本科常见；检测机构、设备企业。
    skills:
      - 电气测试、仪器、标准
      - EMC、可靠性、数据分析
      - 报告写作和问题定位
    growth: 测试工程师 → 高级 → 实验室/质量负责人。
    fit_signals:
      - 喜欢实验、标准和细节
      - 能接受重复测试和报告
      - 对认证和可靠性有兴趣
    dealbreakers:
      - 排斥实验、仪器和报告
      - 只想做设计
    keywords:
      - 电气测试
      - 认证工程师
      - 可靠性测试
      - 实验室

  - id: field_service
    name: 现场调试/技术支持工程师
    summary: 做电气设备现场安装、调试、故障处理和客户支持。
    day_to_day:
      - 现场安装、调试和故障排查
      - 做客户培训、备件和技术方案
      - 反馈质量问题，推动产品改进
    entry: 电气、自动化等本科常见；设备厂、工程公司。
    skills:
      - 电气基础、PLC、调试
      - 客户沟通、现场问题处理
      - 备件、服务和项目管理
    growth: 技术支持 → 高级 → 服务经理/项目经理。
    fit_signals:
      - 喜欢出差和现场
      - 沟通能力强，能独立处理问题
      - 愿意从技术走向服务/产品
    dealbreakers:
      - 不愿出差或面对客户
      - 只想做纯研发
    keywords:
      - 现场调试
      - 技术支持
      - 售后工程师
      - 电气服务

