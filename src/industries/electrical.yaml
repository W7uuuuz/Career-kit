description: >-
  覆盖电力设备与成套、电力电子与驱动、自动化与控制、供配电与建筑电气、
  电气测试与认证、现场调试与技术支持，以及智能电网与继电保护。
  以电气工程及其自动化、自动化、电子信息工程、机械电子工程、
  建筑电气与智能化等专业为主要人才来源。

