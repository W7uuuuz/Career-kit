id: finance
name: 金融行业
status: supported
data_fit: medium
aliases:
  - 金融
  - 金融业
  - 银行
  - 银行业
  - 证券
  - 券商
  - 基金
  - 公募
  - 保险
  - 投行
  - 资产管理
  - 资管
  - 财富管理
description: >-
  覆盖银行、证券、公募基金、保险、资产管理、PE/VC 与金融科技。
  核心岗位集中在投行承做、行业研究、量化、风险管理、合规和资管投研。
  以金融学、经济学、会计学、金融工程、统计学、数学和计算机为主要人才来源；
  学历与实习经历在头部机构筛选中权重较高。

related_majors:
  core:
    - 金融学
    - 金融工程
    - 经济学
    - 会计学
    - 财务管理
    - 投资学
    - 保险学
    - 统计学
  adjacent:
    - 数学与应用数学
    - 计算机科学与技术
    - 软件工程
    - 数据科学与大数据技术
    - 法学
    - 国际经济与贸易
    - 审计学
    - 信息管理与信息系统

major_aliases:
  金融: 金融学
  金工: 金融工程
  经济: 经济学
  会计: 会计学
  财管: 财务管理
  投资: 投资学
  保险: 保险学
  统计: 统计学
  数学: 数学与应用数学
  计科: 计算机科学与技术
  软工: 软件工程
  大数据: 数据科学与大数据技术

subdirections:
  - id: banking
    name: 银行
    description: 对公/零售业务、信贷审批、资产负债与网点运营，覆盖国有行、股份行和城商行。
  - id: securities
    name: 证券/投行
    description: 投行承做、卖方研究、经纪与财富管理，头部券商对实习经历和财务基础要求高。
  - id: fund
    name: 公募/资管
    description: 买方研究、组合管理、交易与产品运营，关注研究能力和长期业绩归因。
  - id: insurance
    name: 保险
    description: 精算、核保核赔、保险资管与渠道管理，集团总部与资管子公司岗位差异较大。
  - id: risk_compliance
    name: 风控/合规
    description: 信用风险、市场风险、操作风险与反洗钱，银行、券商和金融科技都有稳定需求。
  - id: fintech
    name: 金融科技
    description: 用数据和系统做风控建模、量化交易、支付清算与业务数字化。

leading_companies:
  - 中金公司
  - 中信证券
  - 华泰证券
  - 国泰海通
  - 中信建投
  - 招商银行
  - 中国平安
  - 易方达基金
  - 华夏基金
  - 嘉实基金

roles:
  - id: investment_banking
    name: 投行/承做
    summary: 参与 IPO、再融资、并购重组等项目，做尽职调查、底稿和申报材料。
    day_to_day:
      - 整理底稿、访谈纪要和尽调资料
      - 搭财务模型、做可比公司和交易分析
      - 写招股书/重组报告书章节并反复修订
    entry: 金融、会计、经济、法学等专业常见；头部机构普遍偏好硕士和投行/审计实习。
    skills:
      - 财务报表分析与会计基础
      - Excel 建模、Wind/Choice 等数据终端
      - 尽调、写作、沟通和抗压能力
    growth: 实习生/分析师 → 高级分析师 → 项目经理 → 业务负责人。
    fit_signals:
      - 能接受高强度项目和频繁出差
      - 对财务数字、材料和细节敏感
      - 愿意长期积累项目与行业经验
    dealbreakers:
      - 完全不能接受加班和项目制节奏
      - 排斥写材料与重复核对底稿
    keywords:
      - 投资银行
      - 投行
      - 承做

  - id: equity_research
    name: 行业研究/卖方研究
    summary: 跟踪行业与公司基本面，做模型、写研究报告并服务机构客户。
    day_to_day:
      - 跟踪行业数据、公告和政策变化
      - 搭建盈利预测模型、写深度报告
      - 路演、电话会和客户问题回复
    entry: 金融、经济、统计等专业常见；研究岗常要求相关行业实习和研究作品。
    skills:
      - 财务分析与估值建模
      - 行业研究框架、数据检索和写作
      - 英语阅读与机构沟通
    growth: 研究助理 → 分析师 → 高级分析师 → 首席/研究负责人。
    fit_signals:
      - 喜欢长期跟踪一个行业
      - 能独立查数据、写长文、讲逻辑
      - 对市场和公司基本面有好奇心
    dealbreakers:
      - 不愿意大量阅读和写作
      - 只想做交易、不愿做基本面研究
    keywords:
      - 行业研究
      - 行研
      - 研究员

  - id: quant
    name: 量化研究/开发
    summary: 用统计和编程做策略研究、回测、因子与交易系统。
    day_to_day:
      - 清洗行情/基本面数据，研究因子和信号
      - 写回测、评估策略收益与风险
      - 和交易、工程团队一起上线与监控
    entry: 数学、统计、计算机、金融工程等专业常见；更看编程、数学和实盘/竞赛经历。
    skills:
      - Python/C++、数据处理和回测框架
      - 概率统计、时间序列和优化
      - 市场微观结构或因子研究
    growth: 量化研究员 → 高级研究员/基金经理 → 投资负责人。
    fit_signals:
      - 数学和编程都愿意深入
      - 能接受策略失效和反复迭代
      - 对市场数据和交易机制好奇
    dealbreakers:
      - 不愿意写代码或补数学基础
      - 无法接受结果不确定和高强度竞争
    keywords:
      - 量化研究
      - 量化开发
      - 量化

  - id: risk_management
    name: 风险管理
    summary: 识别和计量信用、市场、操作风险，做限额、压力测试和风险报告。
    day_to_day:
      - 跑风险模型、监控敞口和限额
      - 做压力测试、风险报告和监管报送
      - 和业务、科技团队讨论风险方案
    entry: 金融、统计、数学、计算机等专业常见；银行、券商和金融科技均有岗位。
    skills:
      - 统计建模、SQL/Python 和数据分析
      - 信用/市场风险基础与监管规则
      - 报告写作和跨部门沟通
    growth: 风险分析师 → 高级分析师 → 风险经理 → 风险负责人。
    fit_signals:
      - 对数字和规则敏感、做事谨慎
      - 能接受合规与监管约束
      - 愿意把模型和业务结合起来
    dealbreakers:
      - 排斥规则、报表和重复监控
      - 只想做前台业务、不愿做中后台
    keywords:
      - 风险管理
      - 风控
      - 信用风险

  - id: compliance
    name: 合规/内控
    summary: 做合规审查、反洗钱、内控制度和监管沟通，保证业务在规则内运行。
    day_to_day:
      - 审核业务方案和营销材料
      - 跟踪监管新规、更新制度流程
      - 做反洗钱监测、检查和整改
    entry: 法学、金融、会计等专业常见；券商、银行、基金和支付机构均有需求。
    skills:
      - 金融监管规则与法律基础
      - 合规审查、风险识别和文档能力
      - 沟通、推动和原则性
    growth: 合规专员 → 合规经理 → 合规负责人。
    fit_signals:
      - 重视规则、边界和证据
      - 能耐心读法规和写制度
      - 愿意和业务方沟通推动整改
    dealbreakers:
      - 不喜欢读法规和写文档
      - 不愿意承担合规责任和压力
    keywords:
      - 合规
      - 反洗钱
      - 内控

  - id: asset_management
    name: 基金/资管投研
    summary: 做买方研究、组合辅助、交易支持和产品运营，服务公募、保险资管和理财子。
    day_to_day:
      - 跟踪持仓和候选标的，写研究纪要
      - 辅助组合管理、交易执行和业绩归因
      - 支持产品发行、渠道和客户沟通
    entry: 金融、经济、统计等专业常见；买方研究对实习和独立研究能力要求高。
    skills:
      - 财务分析、估值和组合基础
      - 数据分析、Wind/Choice 和 Excel
      - 研究写作与投资沟通
    growth: 研究助理 → 研究员 → 基金经理助理 → 基金经理。
    fit_signals:
      - 对投资和长期研究有耐心
      - 能独立形成并复盘判断
      - 接受业绩考核和不确定性
    dealbreakers:
      - 只想短期追热点、不愿做深度研究
      - 无法接受长期业绩压力
    keywords:
      - 基金研究
      - 资产管理
      - 投资研究

  - id: corporate_banking
    name: 银行对公/零售
    summary: 做客户拓展、授信方案、贷后管理和网点/零售业务。
    day_to_day:
      - 拜访客户、了解融资需求并写授信报告
      - 跟进审批、放款和贷后检查
      - 维护客户关系、完成业务指标
    entry: 金融、经济、会计等专业常见；分行和支行校招入口较多，部分岗位有营销指标。
    skills:
      - 财务报表分析和授信报告
      - 客户沟通、营销和关系维护
      - 风险意识与流程执行
    growth: 客户经理 → 高级客户经理 → 团队负责人 → 支行/部门管理。
    fit_signals:
      - 愿意和客户打交道、跑业务
      - 能接受业绩指标和拜访节奏
      - 重视稳定和长期客户关系
    dealbreakers:
      - 完全不愿意做营销或见客户
      - 不能接受指标压力
    keywords:
      - 客户经理
      - 对公业务
      - 银行

  - id: fintech
    name: 金融科技/数据
    summary: 用数据、模型和系统做风控、量化、支付清算与业务数字化。
    day_to_day:
      - 清洗业务数据、搭指标和风险模型
      - 和业务/工程团队做需求与上线
      - 监控模型效果、排查数据和系统问题
    entry: 计算机、统计、数学、金融工程等专业常见；金融科技子公司和银行科技部门需求较多。
    skills:
      - SQL/Python、数据分析和建模
      - 金融业务理解与风控常识
      - 接口、系统和跨团队协作
    growth: 数据分析/开发 → 高级工程师/建模专家 → 技术或业务负责人。
    fit_signals:
      - 喜欢数据和系统落地
      - 愿意理解金融业务而不是只写代码
      - 能接受强监管和数据安全要求
    dealbreakers:
      - 完全不想接触金融业务规则
      - 排斥数据清洗和线上问题排查
    keywords:
      - 金融科技
      - 金融数据分析
      - 数据风控

