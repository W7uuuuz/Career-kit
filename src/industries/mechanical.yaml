  覆盖机械设计、工艺制造、CAE 仿真、自动化设备、质量可靠性、设备服务，
  以及工程机械、重型机械、机床和通用机械。以机械设计制造及其自动化、
  机械工程、机械电子工程、材料成型及控制工程、车辆工程、智能制造工程
  等专业为主要人才来源。

