subdirections:
  - id: design
    name: 机械设计/结构
    description: 产品结构、零部件、整机设计，做方案、建模、出图和校核。
  - id: manufacturing
    name: 工艺/制造
    description: 加工、装配、产线和试产，做工艺路线、工装和现场问题处理。
  - id: cae
    name: CAE/仿真
    description: 结构、热、流体、疲劳等仿真，支撑设计优化和问题定位。
  - id: automation_equipment
    name: 自动化/设备
    description: 非标设备、产线自动化、机器人调试和设备维护。
  - id: quality
    name: 质量/可靠性
    description: 质量体系、可靠性测试、供应商质量和问题闭环。
  - id: equipment_service
    name: 设备技术支持/售后
    description: 设备选型、安装调试、客户培训和技术支持。
  - id: machine_tool
    name: 机床/工业母机
    description: 数控机床、加工中心、磨床和关键功能部件。
  - id: heavy_machinery
    name: 工程机械/重型机械
    description: 挖掘、起重、矿山、冶金、能源装备等大型机械。

