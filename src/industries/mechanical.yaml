roles:
  - id: mechanical_design
    name: 机械设计/结构工程师
    summary: 做产品结构、零部件和整机的设计、选型、校核和图纸。
    day_to_day:
      - 做结构方案、3D 建模、出图和公差配合
      - 做强度、刚度、寿命校核和选型
      - 跟样机、试产、模具和供应商闭环
    entry: 机械设计制造及其自动化、机械工程、机械电子工程等本科常见；项目和作品重要。
    skills:
      - 机械原理、材料力学、机械设计
      - CAD/CAE、公差配合、GD&T
      - 图纸规范、DFM/DFA
    growth: 设计工程师 → 高级 → 主任/技术专家/项目经理。
    fit_signals:
      - 喜欢结构、细节和动手
      - 能接受改图、试产和现场问题
      - 愿意长期积累产品和工艺经验
    dealbreakers:
      - 讨厌图纸和反复修改
      - 完全不愿去车间或现场
    keywords:
      - 机械设计
      - 结构工程师
      - 机械工程师
      - 产品结构

  - id: process_manufacturing
    name: 工艺/制造工程师
    summary: 做加工工艺、装配工艺、产线规划和现场问题处理。
    day_to_day:
      - 编工艺路线、设计工装夹具
      - 做产线平衡、试产导入和异常处理
      - 跟质量、生产、设备、供应商协作
    entry: 机械、材料成型、工业工程等本科常见；制造企业。
    skills:
      - 机械加工工艺、装配工艺
      - 工装夹具、CAD、数据分析
      - 现场问题处理和持续改善
    growth: 工艺工程师 → 高级 → 工艺主管/制造经理。
    fit_signals:
      - 喜欢现场和流程优化
      - 能接受车间环境和项目节奏
      - 愿意和一线、设备、质量打交道
    dealbreakers:
      - 排斥车间、现场和重复验证
      - 只想坐办公室做设计
    keywords:
      - 工艺工程师
      - 制造工程师
      - 装配工艺
      - 机加工艺

  - id: cae_simulation
    name: CAE/仿真工程师
    summary: 做结构、热、流体、疲劳等仿真，支撑设计优化和问题定位。
    day_to_day:
      - 建模、网格划分和边界条件设置
      - 做结构/热/流体/疲劳仿真和报告
      - 和试验对标，定位设计或工艺问题
    entry: 机械、力学、车辆、能源等；硕士更常见，本科有项目也可。
    skills:
      - 材料力学、有限元、传热/流体基础
      - ANSYS/Abaqus/HyperMesh 等
      - Python、数据处理和报告
    growth: 仿真工程师 → 高级 → 专家/技术管理。
    fit_signals:
      - 喜欢力学、建模和数据分析
      - 能接受大量计算、验证和报告
      - 愿意和设计、试验、工艺协作
    dealbreakers:
      - 排斥仿真、建模和报告
      - 只想做纯结构设计
    keywords:
      - CAE工程师
      - 仿真工程师
      - 有限元
      - 结构仿真

  - id: automation_equipment
    name: 自动化/设备工程师
    summary: 做自动化产线、非标设备、机器人调试和设备维护。
    day_to_day:
      - 做非标设备/产线方案和机械设计
      - 做 PLC、机器人、视觉和电气调试
      - 处理设备故障、维护和改造
    entry: 机械电子、自动化、机械等本科常见；制造企业、设备商。
    skills:
      - 机械设计、PLC、机器人
      - 电气基础、传感器、现场调试
      - 项目沟通和问题闭环
    growth: 设备工程师 → 高级 → 项目经理/技术管理。
    fit_signals:
      - 喜欢机电结合和现场调试
      - 能接受出差和项目节奏
      - 愿意动手解决设备问题
    dealbreakers:
      - 排斥电气、编程和现场
      - 只想做纯机械设计
    keywords:
      - 自动化工程师
      - 设备工程师
      - 非标设计
      - 机器人调试

  - id: quality_reliability
    name: 质量/可靠性工程师
    summary: 做质量体系、可靠性测试、供应商质量和问题闭环。
    day_to_day:
      - 做质量策划、检验标准和可靠性测试
      - 处理客户投诉、8D 和质量问题
      - 审核供应商、推动持续改善
    entry: 机械、材料、工业工程等本科常见；制造企业。
    skills:
      - 质量管理、统计、可靠性
      - GD&T、8D、FMEA、SPC
      - 跨部门沟通和数据分析
    growth: 质量工程师 → 高级 → 质量经理。
    fit_signals:
      - 喜欢流程、标准和数据分析
      - 能接受跨部门沟通和现场
      - 对可靠性和质量有兴趣
    dealbreakers:
      - 排斥流程、报告和沟通
      - 只想做纯技术
    keywords:
      - 质量工程师
      - 可靠性工程师
      - SQE
      - 质量管理

  - id: equipment_service
    name: 设备技术支持/售后工程师
    summary: 做设备选型、安装调试、客户培训和技术支持。
    day_to_day:
      - 现场安装、调试和设备故障处理
      - 做客户培训、备件和技术方案
      - 反馈质量问题，推动产品改进
    entry: 机械、机电、自动化等本科常见；设备制造企业。
    skills:
      - 机械/电气基础、设备调试
      - 客户沟通、现场问题处理
      - 备件、服务和项目管理
    growth: 技术支持 → 高级 → 服务经理/产品经理。
    fit_signals:
      - 喜欢出差和客户沟通
      - 动手能力强，能独立处理问题
      - 愿意从技术走向服务/产品
    dealbreakers:
      - 不愿出差或面对客户
      - 只想做纯研发
    keywords:
      - 技术支持
      - 售后工程师
      - 设备调试
      - 服务工程师

