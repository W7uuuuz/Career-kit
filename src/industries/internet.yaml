id: internet
name: 互联网/软件行业
status: supported
aliases:
  - 互联网
  - 软件
  - 计算机
  - IT
  - 信息技术
  - 互联网/软件
description: >-
  以软件开发、数据、算法、网络安全、测试运维和产品为核心岗位的行业。
  覆盖计算机科学与技术、软件工程、大数据、网络空间安全、人工智能等相关专业。

related_majors:
  core:
    - 计算机科学与技术
    - 软件工程
    - 网络工程
    - 信息安全
    - 网络空间安全
    - 数据科学与大数据技术
    - 人工智能
    - 物联网工程
    - 数字媒体技术
  adjacent:
    - 电子信息工程
    - 通信工程
    - 自动化
    - 数学与应用数学
    - 统计学

major_aliases:
  计科: 计算机科学与技术
  计算机: 计算机科学与技术
  计算机科学: 计算机科学与技术
  软工: 软件工程
  网安: 网络空间安全
  信安: 信息安全
  大数据: 数据科学与大数据技术
  AI: 人工智能
  人工智能: 人工智能
  物联网: 物联网工程

subdirections:
  - id: software
    name: 软件开发
    description: 做产品背后的服务、接口、客户端和工程基础设施。
  - id: data
    name: 数据
    description: 用数据描述业务、发现问题，并支撑决策与产品迭代。
  - id: ai
    name: 算法与 AI
    description: 做模型、推荐、搜索、大模型应用与效果评测。
  - id: security
    name: 网络安全
    description: 保护系统、数据和业务，做攻防、合规与安全工程。
  - id: quality
    name: 测试与运维
    description: 保证系统可交付、可运行、可观测，支撑持续发布。
  - id: product
    name: 产品
    description: 理解用户和业务，定义需求、方案与优先级。

roles:
  - id: backend
    name: 后端开发
    summary: 做系统背后的接口、业务逻辑、数据存储和稳定性。
    day_to_day:
      - 参与需求评审，拆接口和数据模型
      - 写服务端代码，联调、测试、排查线上问题
      - 做性能、稳定性和安全加固
    entry: 本科及以上常见；更看项目、基础和工程能力，专业限制相对宽。
    skills:
      - 一门主力语言（Java / Python / Go / C++ 等）
      - 数据库、缓存、网络与操作系统基础
      - Git、Linux、调试与线上排查
    growth: 初级开发 → 高级开发 → 技术专家 / 架构 / 技术管理。
    fit_signals:
      - 愿意长期调试和拆解复杂问题
      - 能接受线上值班和稳定性压力
      - 喜欢把东西做出来并持续优化
    dealbreakers:
      - 完全不能接受长时间专注和排查
      - 只想做短期、不愿补计算机基础
    keywords:
      - 后端开发
      - Java开发
      - Python后端

  - id: frontend
    name: 前端开发
    summary: 做用户直接看到和操作的界面，以及前端工程化。
    day_to_day:
      - 还原设计稿，实现页面和交互
      - 对接接口，处理兼容、性能和异常
      - 维护组件库和前端工程链路
    entry: 本科及以上常见；作品和项目比专业标签更重要。
    skills:
      - JavaScript / TypeScript、HTML、CSS
      - React / Vue 等框架
      - 浏览器、网络、性能与工程化基础
    growth: 初级前端 → 高级前端 → 前端专家 / 全栈 / 技术管理。
    fit_signals:
      - 对界面、交互和用户体验敏感
      - 愿意打磨细节和兼容性
      - 能接受需求频繁变化
    dealbreakers:
      - 完全不愿意处理视觉和交互细节
      - 只想写后端、不愿碰页面
    keywords:
      - 前端开发
      - Web前端
      - React前端

  - id: data
    name: 数据分析 / 数据开发
    summary: 用 SQL、统计和业务理解，把数据变成可行动的结论或数据资产。
    day_to_day:
      - 取数、清洗、做指标和报表
      - 分析业务问题，输出结论和建议
      - 建数据管道或支持实验评估
    entry: 本科及以上常见；统计、数学、计算机背景都有机会。
    skills:
      - SQL、Excel、Python
      - 统计与实验基础
      - 业务理解、可视化与表达
    growth: 数据分析师 → 高级分析 / 数据科学家 → 数据负责人。
    fit_signals:
      - 喜欢从数据里找规律
      - 能把复杂结论讲清楚
      - 对业务和指标敏感
    dealbreakers:
      - 讨厌处理脏数据和重复取数
      - 不愿意和业务方沟通
    keywords:
      - 数据分析
      - 数据开发
      - 商业分析

  - id: ai
    name: 算法 / AI 应用
    summary: 做模型、推荐、搜索、大模型应用与评测。
    day_to_day:
      - 读论文/方案，做实验和离线评测
      - 清洗数据、训练/调用模型、分析效果
      - 和工程团队一起上线并监控
    entry: 本科及以上常见；算法岗更看项目、基础和研究经历。
    skills:
      - Python、机器学习/深度学习基础
      - 数学与统计
      - LLM / RAG / 评测 / 工程化中的至少一项
    growth: 算法工程师 → 高级算法 / AI 应用专家 → 技术负责人。
    fit_signals:
      - 愿意持续读新东西、做实验
      - 能接受结果不确定和反复迭代
      - 数学和工程至少有一项扎实
    dealbreakers:
      - 只想调包、不愿理解原理
      - 不能接受长期没有确定答案
    keywords:
      - 算法工程师
      - AI应用
      - 大模型

  - id: security
    name: 网络安全
    summary: 做攻防、安全开发、合规与风险治理。
    day_to_day:
      - 做漏洞分析、渗透测试和安全评估
      - 建设安全工具、监控和应急响应
      - 跟进合规要求和安全事件
    entry: 本科及以上常见；证书和实战经历有加分。
    skills:
      - 网络、操作系统、Web 安全基础
      - 至少一种脚本语言
      - 渗透/逆向/安全开发/合规中的方向
    growth: 安全工程师 → 高级安全 / 安全专家 → 安全负责人。
    fit_signals:
      - 对攻防和系统底层好奇
      - 能接受应急响应和持续学习
      - 做事谨慎、重视边界
    dealbreakers:
      - 不愿意承担合规和责任压力
      - 只想做“黑客感”玩法、不愿打基础
    keywords:
      - 网络安全
      - 安全工程师
      - 渗透测试

  - id: quality
    name: 测试 / 运维
    summary: 保证系统可交付、可运行、可观测，支撑持续发布。
    day_to_day:
      - 设计测试用例，做自动化和回归
      - 维护 CI/CD、监控、告警和故障处理
      - 和开发一起定位问题、改进流程
    entry: 本科/专科均有入口；自动化和云原生经验加分。
    skills:
      - Linux、脚本、网络基础
      - 测试框架或 CI/CD / 容器 / 监控
      - 问题定位和沟通
    growth: 测试/运维工程师 → SRE / DevOps / 质量负责人。
    fit_signals:
      - 细心、愿意把流程做稳
      - 能接受告警和故障响应
      - 喜欢工具化和自动化
    dealbreakers:
      - 讨厌重复性工作和值班
      - 不愿意深挖系统问题
    keywords:
      - 测试工程师
      - 运维工程师
      - SRE

  - id: product
    name: 产品经理
    summary: 理解用户和业务，定义需求、方案与优先级。
    day_to_day:
      - 做用户研究、数据分析和需求判断
      - 写方案、画原型、和研发设计对齐
      - 跟进上线、复盘效果
    entry: 本科及以上常见；实习、作品和业务理解更重要。
    skills:
      - 用户研究、需求分析、数据分析
      - 沟通、写作、原型工具
      - 对至少一个业务领域有理解
    growth: 产品助理 → 产品经理 → 高级产品 / 产品负责人。
    fit_signals:
      - 喜欢理解人和业务
      - 能在模糊问题里做取舍
      - 愿意沟通、推动和复盘
    dealbreakers:
      - 不愿意和人频繁沟通
      - 只想执行、不愿判断优先级
    keywords:
      - 产品经理
      - 产品助理
      - 用户产品

