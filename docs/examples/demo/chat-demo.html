<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Kit · AI 职业陪练（在线演示）</title>
<meta name="career-kit-demo" content="chat-first">
<style>
:root {
  --bg: #f3f5fb; --chat-bg: #f8f9fd; --card: #ffffff; --ink: #1f2430;
  --muted: #8a93a6; --line: #e6e9f0; --brand: #4a6cf7; --brand-2: #6f8bff;
  --brand-soft: #eef1fe; --ok: #22a06b; --ok-soft: #e8f7f0; --warn: #b26a00;
  --radius: 16px;
  --shadow: 0 1px 3px rgba(31,36,48,.06), 0 8px 24px rgba(31,36,48,.08);
  --shadow-lift: 0 6px 22px rgba(74,108,247,.22);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  color: var(--ink); line-height: 1.6;
  background:
    radial-gradient(1100px 460px at 10% -12%, #e3e8ff 0%, transparent 60%),
    radial-gradient(900px 420px at 100% -20%, #e0ecff 0%, transparent 55%),
    var(--bg);
}
.page { max-width: 820px; margin: 0 auto; padding: 0 16px; display: flex; flex-direction: column; height: 100%; }

/* ---------- 顶栏 ---------- */
.top { display: flex; align-items: center; gap: 12px; padding: 14px 2px 8px; }
.logo { width: 38px; height: 38px; border-radius: 11px; flex: none;
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 15px;
  box-shadow: 0 4px 12px rgba(74,108,247,.35); }
.top-txt { min-width: 0; }
.top-txt h1 { font-size: 16.5px; letter-spacing: .2px; }
.top-txt p { font-size: 12px; color: var(--muted); }
.demo-tag { margin-left: auto; font-size: 11px; color: var(--brand);
  background: var(--brand-soft); border: 1px solid #dfe4ff;
  padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.restart { white-space: nowrap; border: 1px solid var(--line); background: var(--card);
  color: var(--muted); font-size: 12px; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.restart:hover { color: var(--brand); border-color: var(--brand); }

/* ---------- 旅程刻度 ---------- */
.stepper { display: flex; gap: 6px; padding: 0 2px 10px; overflow-x: auto;
  scrollbar-width: none; -ms-overflow-style: none; }
.stepper::-webkit-scrollbar { display: none; }
.stepchip { flex: none; display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; color: var(--muted); background: rgba(255,255,255,.72);
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px;
  transition: all .3s; opacity: .55; }
.stepchip i { width: 7px; height: 7px; border-radius: 50%; background: #d3d8e6; transition: all .3s; }
.stepchip.pass { opacity: 1; }
.stepchip.pass i { background: var(--ok); }
.stepchip.now { opacity: 1; color: var(--brand); border-color: #c9d3ff;
  background: #fff; box-shadow: 0 0 0 3px #eef1fe; }
.stepchip.now i { background: var(--brand); }

/* ---------- 对话区 ---------- */
.chat-card { background: var(--chat-bg); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow);
  display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
.chat { flex: 1; overflow-y: auto; padding: 18px 16px 8px; scroll-behavior: smooth; }
.chat::-webkit-scrollbar { width: 8px; }
.chat::-webkit-scrollbar-thumb { background: #dce0ec; border-radius: 4px; }

.msg { display: flex; gap: 9px; margin-bottom: 14px; animation: rise .35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.msg .ava { width: 30px; height: 30px; border-radius: 9px; flex: none; margin-top: 2px;
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.bubble { max-width: 82%; border-radius: 14px; padding: 10px 14px; font-size: 13.8px;
  box-shadow: 0 1px 2px rgba(31,36,48,.05); }
.ai .bubble { background: var(--card); border: 1px solid var(--line); border-top-left-radius: 5px; }
.user { flex-direction: row-reverse; }
.user .bubble { background: linear-gradient(135deg, var(--brand), var(--brand-2));
  color: #fff; border-top-right-radius: 5px; }
.bubble b { color: inherit; }
.ai .bubble b { color: #2b3674; }
.bubble ul { margin: 6px 0 0 18px; font-size: 13px; }
.bubble li { margin: 3px 0; }
.bubble .flag { color: var(--warn); font-weight: 600; }
.bubble .okc { color: var(--ok); font-weight: 600; }
.score { display: inline-flex; align-items: baseline; gap: 4px 10px; flex-wrap: wrap;
  margin-top: 8px; background: #fff; border: 1px solid var(--line); border-radius: 10px;
  padding: 6px 10px; font-size: 12px; color: var(--muted); }
.score .seg { white-space: nowrap; }
.score b { font-size: 17px; color: var(--brand); white-space: nowrap; }

/* ---------- 调研结果：通栏面板 ---------- */
.research { display: block; margin: -4px 0 16px; }
.research .anchor { display: flex; align-items: center; gap: 8px; color: var(--brand);
  font-size: 12px; margin: 0 0 8px 40px; white-space: nowrap; }
.research .anchor .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--brand);
  box-shadow: 0 0 0 0 rgba(74,108,247,.5); animation: pulse 1.8s infinite; }
.research .anchor .line { flex: 1; max-width: 60px; height: 1px; background:
  linear-gradient(90deg, rgba(74,108,247,.55), transparent); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(74,108,247,.45); }
  70% { box-shadow: 0 0 0 9px rgba(74,108,247,0); } 100% { box-shadow: 0 0 0 0 rgba(74,108,247,0); } }
.research .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 -2px; }
.rcard { position: relative; background: linear-gradient(180deg, #ffffff 0%, #f7f9ff 100%);
  border: 1px solid #dde4ff; border-radius: 14px; padding: 13px 14px 12px;
  box-shadow: var(--shadow); opacity: 0; transform: translateY(16px) scale(.97);
  animation: cardIn .55s cubic-bezier(.22,.9,.28,1) both; }
@keyframes cardIn { to { opacity: 1; transform: none; } }
.rcard:hover { border-color: var(--brand); box-shadow: var(--shadow-lift); transition: .2s; }
.rcard .kind { display: inline-flex; align-items: center; gap: 5px; font-size: 11px;
  color: var(--brand); background: var(--brand-soft); border-radius: 999px; padding: 2px 8px; }
.rcard h4 { font-size: 13.5px; margin: 8px 0 4px; }
.rcard p { font-size: 12px; color: #5a6270; }
.rcard .foot { display: flex; align-items: center; gap: 6px; margin-top: 9px;
  font-size: 11px; color: var(--muted); }
.rcard .foot .okdot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
@media (max-width: 680px) { .research .cards { grid-template-columns: 1fr; } }

/* ---------- 路线阶段面板（独立前端，不塞进气泡） ---------- */
.plan { display: block; margin: -4px 0 16px; }
.plan .anchor { display: flex; align-items: center; gap: 8px; color: var(--brand);
  font-size: 12px; margin: 0 0 8px 40px; white-space: nowrap; }
.plan .anchor .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--brand);
  animation: pulse 1.8s infinite; }
.plan .anchor .line { flex: 1; max-width: 60px; height: 1px;
  background: linear-gradient(90deg, rgba(74,108,247,.55), transparent); }
.plan .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 0 -2px; }
.pcard { position: relative; background: #fff; border: 1px solid #dde4ff;
  border-radius: 14px; padding: 13px 14px 12px; box-shadow: var(--shadow);
  opacity: 0; transform: translateY(14px); animation: cardIn .5s cubic-bezier(.22,.9,.28,1) both; }
.pcard:hover { border-color: var(--brand); box-shadow: var(--shadow-lift); transition: .2s; }
.pcard .no { position: absolute; right: 12px; top: 10px; font-size: 11px;
  color: var(--brand); background: var(--brand-soft); border-radius: 8px; padding: 1px 7px; }
.pcard h4 { font-size: 13.5px; padding-right: 44px; }
.pcard .goal { font-size: 12px; color: #5a6270; margin-top: 5px; }
.pcard .kpi { font-size: 11.5px; color: var(--muted); margin-top: 6px;
  padding-top: 6px; border-top: 1px dashed var(--line); }
.pcard .kpi b { color: var(--ok); font-weight: 600; }
@media (max-width: 680px) { .plan .grid { grid-template-columns: 1fr; } }

/* ---------- 输入指示 ---------- */
.typing { display: inline-flex; gap: 4px; padding: 12px 14px; background: var(--card);
  border: 1px solid var(--line); border-radius: 14px; border-top-left-radius: 5px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: #b9c2d8;
  animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .18s; }
.typing i:nth-child(3) { animation-delay: .36s; }
@keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

/* ---------- 行动区 ---------- */
.actionbar { border-top: 1px solid var(--line); background: rgba(255,255,255,.94);
  padding: 12px 16px 14px; min-height: 80px; max-height: 56vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: 8px; justify-content: center; }
.hint { font-size: 11.5px; color: var(--muted); min-height: 15px; text-align: center; }
.opts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.opts > .picker { flex: 1 1 100%; width: 100%; }
.opts > .sendrow { flex: 1 1 100%; width: 100%; }
.opt { border: 1.4px solid #ccd6ff; background: #fff; color: var(--brand);
  font-size: 13.5px; padding: 8px 16px; border-radius: 999px; cursor: pointer;
  transition: transform .12s, box-shadow .12s, opacity .2s; animation: rise .3s ease both; }
.opt:hover { border-color: var(--brand); transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(74,108,247,.25); }
.opt:active { transform: translateY(0); box-shadow: none; }
.opt.primary { background: linear-gradient(135deg, var(--brand), var(--brand-2));
  border-color: transparent; color: #fff; }
.opt:disabled { opacity: .45; cursor: default; transform: none; box-shadow: none; }
.opt:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

/* 分轮信息：可选卡片（3-4 项自适应） */
.picker { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.pick { position: relative; text-align: left; cursor: pointer; background: #fff;
  border: 1.6px solid var(--line); border-radius: 13px; padding: 12px 13px 11px;
  transition: border-color .15s, box-shadow .15s, transform .12s, background .15s; }
.pick:hover { border-color: #b9c6ff; transform: translateY(-1px); }
.pick:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.pick .p-title { font-size: 13.5px; font-weight: 600; color: var(--ink); }
.pick .p-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
.pick .p-check { position: absolute; top: 10px; right: 10px; width: 18px; height: 18px;
  border-radius: 50%; border: 1.6px solid #d3d9ea; background: #fff;
  display: grid; place-items: center; font-size: 11px; color: transparent; transition: all .15s; }
.pick[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft);
  box-shadow: 0 4px 16px rgba(74,108,247,.18); }
.pick[aria-pressed="true"] .p-check { background: var(--brand); border-color: var(--brand); color: #fff; }
.pick[aria-pressed="true"] .p-title { color: #2b3674; }
@media (max-width: 680px) { .picker { grid-template-columns: 1fr; } }

.sendrow { display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
.sendrow .sel-note { font-size: 11.5px; color: var(--muted); margin-right: auto; }
.send-btn { background: linear-gradient(135deg, var(--brand), var(--brand-2));
  color: #fff; border: none; border-radius: 999px; padding: 9px 22px;
  font-size: 13.5px; cursor: pointer; box-shadow: 0 4px 14px rgba(74,108,247,.3);
  transition: transform .12s, opacity .2s; }
.send-btn:hover { transform: translateY(-1px); }

/* ---------- 职业地图（按所选组合实时渲染） ---------- */
.map-wrap { display: none; flex: 1; min-height: 0; padding: 10px 2px 0; }
.map-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; height: 100%; }
.map-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 600; flex-wrap: wrap; }
.map-head .sub { color: var(--muted); font-size: 12px; font-weight: 400; }
.map-head .lnk { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.map-head a { color: var(--brand); font-size: 12.5px; text-decoration: none; font-weight: 500; }
.map-head a:hover { text-decoration: underline; }
.map-head a.star { color: #b26a00; background: #fff8ea; border: 1px solid #ffe2b0;
  border-radius: 999px; padding: 2px 10px; font-weight: 600; }
.map-head a.star:hover { background: #fff1d6; text-decoration: none; }
.map-foot { display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 9px 14px; border-top: 1px solid var(--line); background: #fbfcff;
  font-size: 12px; color: var(--muted); }
.map-foot a { color: var(--brand); text-decoration: none; font-weight: 600; }
.map-foot a:hover { text-decoration: underline; }
.map-body { flex: 1; overflow-y: auto; padding: 14px 16px 18px; }
.m-sum { display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  padding-bottom: 10px; border-bottom: 1px dashed var(--line); margin-bottom: 12px; }
.m-ring { --p: 0; width: 62px; height: 62px; border-radius: 50%;
  background: conic-gradient(var(--brand) calc(var(--p) * 1%), #e9ecf6 0);
  display: grid; place-items: center; flex: none; }
.m-ring span { width: 48px; height: 48px; border-radius: 50%; background: #fff;
  display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--brand); }
.m-sum .txt { font-size: 12.5px; color: var(--muted); }
.m-sum .txt b { color: var(--ink); font-size: 13.5px; }
.m-strategy { font-size: 12.5px; color: #4a5160; background: var(--brand-soft);
  border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; }
.m-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.m-tab { border: 1px solid var(--line); background: #fff; color: var(--muted);
  font-size: 12px; border-radius: 999px; padding: 4px 11px; cursor: pointer; }
.m-tab.active { background: var(--brand); border-color: var(--brand); color: #fff; }
.m-phase { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  animation: rise .3s ease both; }
.m-phase h4 { font-size: 14px; }
.m-phase .goal { font-size: 12.5px; color: #5a6270; margin-top: 4px; }
.m-phase .kpi { font-size: 12px; color: var(--muted); margin-top: 6px; }
.m-phase .kpi b { color: var(--ok); }
.m-tasks { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
.m-task { display: flex; align-items: flex-start; gap: 9px; padding: 6px 2px; border-radius: 8px; }
.m-task:hover { background: var(--brand-soft); }
.m-task input { width: 16px; height: 16px; margin-top: 2px; accent-color: var(--brand); cursor: pointer; }
.m-task .tname { flex: 1; font-size: 13px; }
.m-task .tname.done { text-decoration: line-through; color: var(--muted); }
.m-task .tmode { font-size: 11px; color: var(--muted); }
.m-empty { color: var(--muted); font-size: 12.5px; }

.footer { padding: 10px 2px 14px; text-align: center; color: var(--muted); font-size: 11.8px; }
@media (max-width: 640px) {
  .msg .bubble { max-width: 88%; }
  .demo-tag { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

<div class="page">
  <div class="top">
    <div class="logo">CK</div>
    <div class="top-txt">
      <h1>Career Kit · AI 职业陪练</h1>
      <p>真实岗位数据 × 同背景案例 · 数据存本机</p>
    </div>
    <span class="demo-tag">演示 · 合成数据</span>
    <button class="restart" id="restart-btn" type="button">重新开始</button>
  </div>

  <div class="stepper" id="stepper"></div>

  <div class="chat-card" id="chat-card">
    <div class="chat" id="chat" aria-live="polite"></div>
    <div class="actionbar">
      <div class="hint" id="hint"></div>
      <div class="opts" id="opts"></div>
    </div>
  </div>

  <div class="map-wrap" id="map-wrap">
    <div class="map-card">
      <div class="map-head">
        职业地图 · 按你的选择实时生成
        <span class="sub" id="map-sub"></span>
        <span class="lnk">
          <a href="https://github.com/W7uuuuz/Career-kit" target="_blank" rel="noopener">GitHub 主页</a>
          <a class="star" href="https://github.com/W7uuuuz/Career-kit" target="_blank" rel="noopener">★ 求个 Star</a>
          <a href="#" id="restart-chat">重新开始 ↺</a>
        </span>
      </div>
      <div class="map-body" id="map-body"></div>
      <div class="map-foot">
        这份地图由 Career Kit 生成 · 如果对你有用，欢迎到
        <a href="https://github.com/W7uuuuz/Career-kit" target="_blank" rel="noopener">GitHub 点个 Star ★</a>
      </div>
    </div>
  </div>

  <p class="footer">演示页不接入 LLM；对话、结论与职业地图均由所选信息按规则实时生成（合成数据，非真实用户档案）。</p>
</div>

          note = PICKS.expKey === 'exp_none'
            ? '只有课程作业没关系——先把一个能拿出手的最小项目做出来，简历才有第一行可写。'
            : '没关系——绝大多数人一开始都是这样。这种情况我不会拿话术包装你，先承认现实：<b>简历现在没有可写的产出</b>，下一步就是先做出第一个项目。';
        } else if (PICKS.exp.collab) {
          note = '有团队协作经历——这是很多同背景同学缺的东西，后面规划会围绕它展开。';
        } else if (PICKS.exp.agentProject) {
          note = '独立 Agent 项目不错，但我注意到「AI 辅助、没有人 review」——这会成为诊断的关键点。';
        } else {
          note = '没有实习不是死局，但「零协作证据」会被 HR 直接打折，后面规划会优先补它。';
        }
        return ['<b>' + esc(PICKS.exp.title) + '</b>：' + note,
          '第三问：目标方向和 base 城市，有想法吗？'];
      },
      picker: { key: 'goal', options: ['agent_big', 'app_mid', 'undecided', 'unsure'], goto: 7 } },

    { /* 7 · 档案 + 自动求证 */
      stepName: '建档',
      ai: function () {
        return [
          '信息收齐，档案成型：',
          '<b>学历</b>：' + esc(PICKS.edu.title) + '（' + esc(PICKS.edu.sub) + '）<br>'
            + '<b>经历</b>：' + esc(PICKS.exp.title) + '（' + esc(PICKS.exp.sub) + '）<br>'
            + '<b>目标</b>：' + esc(PICKS.goal.title) + '（' + esc(PICKS.goal.sub) + '）',
          '档案不能照抄简历——我逐项求证一下技能的作者身份和把控度（下面自动进行）：',
        ];
      },
      auto: autoProofSteps,
      opts: [{ label: '下一步：看市场', goto: 8 }] },

    { /* 8 · 调研预告 */
      stepName: '调研',
      ai: function () {
        var lead = PICKS.goal.plan === 'explore' && PICKS.goal.title.indexOf('完全没想法') >= 0
          ? '你还没定方向——我先按 AI 应用、后端、测试等常见方向抓真实 JD 做横向对比，再一起收敛。'
          : '下一步是<b>市场调研</b>。行情不靠模型记忆——围绕你的目标「' + esc(PICKS.goal.target) + '」抓三类真实数据：招聘平台（BOSS，含薪资）、企业官网 JD（任职要求原文）、经验帖（同背景路径）。';
        return [lead, '关键是：抓完不是贴链接，而是把它和<b>你的档案逐条对齐分析</b>。'];
      },
      opts: [{ label: '开始（演示中即时返回）', goto: 9 }] },

    { /* 9 · 调研卡片 + JD/面经分析 */
      stepName: '调研',
      ai: function () {
        return [
          PICKS.goal.plan === 'explore'
            ? '调研完成。你还没定方向——我先横向抓了三类来源做对比（不是替你拍板，而是给你真实参照）：'
            : '调研完成。针对「' + esc(PICKS.goal.title) + ' · ' + esc(PICKS.goal.city) + '」，三条来源已抓取并校验：',
        ];
      },
      research: function () {
        return [
          { kind: '招聘平台 · 含薪资', title: PICKS.goal.cardTitle,
            finding: PICKS.goal.salary, foot: '合成来源 · 真实产品中可点开验证' },
          { kind: '企业 JD 原文', title: PICKS.goal.jdTitle,
            finding: PICKS.goal.jd, foot: '合成来源 · 真实产品中可点开验证' },
          { kind: '同背景经验帖', title: '牛客｜同背景路径',
            finding: PICKS.goal.peer, foot: '合成来源 · 真实产品中可点开验证' },
        ];
      },
      analysis: function () { return jdAnalysis().concat(peerAnalysis()); },
      opts: [{ label: '下一步：差距分析', goto: 10 }] },

    { /* 10 · 差距预告 */
      stepName: '差距',
      ai: ['基于调研数据 + 确认过的档案，差距分析的第一眼结论（逐维度打分，不是客套话）：'],
      opts: [{ label: '看首屏诊断', goto: 11 }] },

    { /* 11 · 首屏诊断 */
      stepName: '差距',
      ai: function () {
        var score = matchScore(), level = startLevel(), plan = PICKS.goal.plan;
        var locked = plan !== 'explore';
        var flags = redFlags().map(function (f) { return '「' + esc(f) + '」'; }).join('、');
        var lines = [];
        if (PICKS.exp.minimal) {
          lines.push('<span class="flag">先说实话：你现在最大的问题不是「选错方向」，而是简历里还没有一行可写的产出。</span>这不是否定你——而是说，先做出来一个东西，比继续纠结方向更重要。');
        } else {
          lines.push('<span class="okc">' + esc(PICKS.exp.strength) + '</span>' +
            (PICKS.edu.strength ? '，' + esc(PICKS.edu.strength) : '') + '——这是可以直接写进简历首条的底牌。');
        }
        lines.push('<span class="flag">主要短板</span>：' + flags + '。' +
          (locked
            ? '目标方向对，缺的是能把差距补上的证据，不是空泛的「再努力」。' + (PICKS.exp.collab ? '' : '协作证据是当前最短的板。')
            : '方向还没锁定，先别急着谈匹配——用「小项目 + 试投」拿真实反馈再定。'));
        lines.push('<span class="score">'
          + '<span class="seg">' + (locked ? '目标匹配度' : '参考匹配度（暂按 AI 应用方向估算）') + ' <b>' + score + '</b>/100</span>'
          + '<span class="seg">起点档位 <b>' + level + '</b></span>'
          + '<span class="seg">（学历 ' + (PICKS.edu.score >= 0 ? '+' + PICKS.edu.score : PICKS.edu.score)
          + ' · 经历 ' + (PICKS.exp.score >= 0 ? '+' + PICKS.exp.score : PICKS.exp.score)
          + ' · 目标难度 ' + (PICKS.goal.score >= 0 ? '+' + PICKS.goal.score : PICKS.goal.score) + '）</span>'
          + '</span>');
        if (level === '暂不可入') {
          lines.push('「暂不可入」是按市场命中率算的档位，不是能力判决——先完成阶段一，它会变。');
        }
        lines.push(picGapLine());
        return lines;
      },
      opts: [{ label: '给我一条走得通的路线', goto: 12 }] },

    { /* 12 · 路线：策略气泡 + 阶段面板 */
      stepName: '路线',
      ai: function () {
        var plan = roadmapPlan();
        return ['<b>策略</b>：' + esc(plan.strategy)];
      },
      plan: roadmapPlan,
      opts: [{ label: '生成职业地图', goto: 13, primary: true }] },

    { /* 13 · 揭晓：按选择实时渲染地图 */
      stepName: '揭晓',
      ai: [],
      opts: [] },
  ];

  function picGapLine() {
    var gaps = [];
    if (PICKS.exp.minimal) gaps.push('第一个可运行的项目（<b>高优</b>）');
    else if (!PICKS.exp.agentProject) gaps.push('可演示的 AI 项目与评测思路（<b>高优</b>）');
    else gaps.push('Agent 工程化：trace / 评测集（<b>高优</b>）');
    if (!PICKS.exp.collab) gaps.push('多人协作 / 代码评审（<b>高优</b>）');
    if (PICKS.edu.major.indexOf('非科班') >= 0) gaps.push('计算机基础：操作系统 / 网络（<b>高优</b>）');
    if (PICKS.goal.plan === 'explore') gaps.push('方向验证：2-3 周小项目 + 试投（<b>高优</b>）');
    if (PICKS.edu.tier.indexOf('双非') >= 0) gaps.push('项目含金量与面试叙事（中优）');
    return '优先补的差距：' + gaps.slice(0, 4).join('；') + '。';
  }

  /* ---------------- 引擎 ---------------- */
  var busy = false;
  var timers = [];

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function addMsg(cls, html) {
    var div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.innerHTML = (cls === 'ai' ? '<div class="ava">CK</div>' : '')
      + '<div class="bubble">' + html + '</div>';
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }
  function renderStepper(name) {
    var idx = STEPS.lastIndexOf(name);
    stepEl.innerHTML = STEPS.map(function (s, i) {
      var cls = 'stepchip';
      if (idx >= 0 && i < idx) cls += ' pass';
      if (s === name) cls += ' now';
      return '<span class="' + cls + '"><i></i>' + s + '</span>';
    }).join('');
  }
  function setOpts(opts) {
    optsEl.innerHTML = '';
    if (!opts || !opts.length) { hintEl.textContent = ''; return; }
    hintEl.textContent = '点击任意一项继续（预设对话 · 真实产品中由 Agent 实时回应）';
    opts.forEach(function (o) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt' + (o.primary ? ' primary' : '');
      b.textContent = o.label;
      b.addEventListener('click', function () {
        if (busy) return;
        addMsg('user', esc(o.label));
        Array.prototype.forEach.call(optsEl.children, function (x) { x.disabled = true; });
        runNode(o.goto);
      });
      optsEl.appendChild(b);
    });
  }

  function showPicker(cfg) {
    optsEl.innerHTML = '';
    hintEl.textContent = '选一项最接近你的情况（演示预置 · 选中后点右下角发送）';
    var dict = cfg.key === 'edu' ? EDU : (cfg.key === 'exp' ? EXP : GOAL);
    var grid = document.createElement('div');
    grid.className = 'picker';
    var selected = 0;
    var cards = cfg.options.map(function (key, i) {
      var opt = dict[key];
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'pick';
      b.setAttribute('aria-pressed', i === selected ? 'true' : 'false');
      b.innerHTML = '<span class="p-check">✓</span>'
        + '<div class="p-title">' + esc(opt.title) + '</div>'
        + '<div class="p-sub">' + esc(opt.sub) + '</div>';
      b.addEventListener('click', function () {
        selected = i;
        cards.forEach(function (c, j) { c.setAttribute('aria-pressed', j === i ? 'true' : 'false'); });
      });
      return b;
    });
    cards.forEach(function (c) { grid.appendChild(c); });

    var row = document.createElement('div');
    row.className = 'sendrow';
    var note = document.createElement('span');
    note.className = 'sel-note';
    note.textContent = '演示数据 · 只读选项';
    var sendBtn = document.createElement('button');
    sendBtn.type = 'button';
    sendBtn.className = 'send-btn';
    sendBtn.textContent = '发送';
    sendBtn.addEventListener('click', function () {
      if (busy) return;
      var key = cfg.options[selected];
      PICKS[cfg.key] = dict[key];
      PICKS[cfg.key + 'Key'] = key;
      addMsg('user', esc(PICKS[cfg.key].title + '｜' + PICKS[cfg.key].sub));
      optsEl.innerHTML = '';
      hintEl.textContent = '';
      runNode(cfg.goto);
    });
    row.appendChild(note);
    row.appendChild(sendBtn);
    optsEl.appendChild(grid);
    optsEl.appendChild(row);
  }

  function addPanel(className, titleHTML, itemsHTML, countLabel) {
    var wrap = document.createElement('div');
    wrap.className = 'msg ' + className;
    wrap.innerHTML = '<div class="anchor"><span class="dot"></span>'
      + esc(countLabel) + '<span class="line"></span></div>'
      + (titleHTML || '') + itemsHTML;
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
    return wrap;
  }

  function addResearch(items) {
    var cards = items.map(function (it, i) {
      return '<div class="rcard" style="animation-delay:' + (120 + i * 140) + 'ms">'
        + '<span class="kind">' + esc(it.kind) + '</span>'
        + '<h4>' + esc(it.title) + '</h4>'
        + '<p>' + esc(it.finding) + '</p>'
        + '<div class="foot"><span class="okdot"></span>' + esc(it.foot) + '</div>'
        + '</div>';
    }).join('');
    addPanel('research', '', '<div class="cards">' + cards + '</div>',
      '已锚定 ' + items.length + ' 个真实来源');
  }

  function addPlan(plan) {
    var cards = plan.phases.map(function (p, i) {
      return '<div class="pcard" style="animation-delay:' + (100 + i * 130) + 'ms">'
        + '<span class="no">阶段 ' + (i + 1) + '</span>'
        + '<h4>' + esc(p.name) + '</h4>'
        + '<div class="goal">' + esc(p.goal) + '</div>'
        + '<div class="kpi">KPI：' + esc(p.kpi) + '</div>'
        + '</div>';
    }).join('');
    addPanel('plan', '', '<div class="grid">' + cards + '</div>',
      '路线已按你的档案拆成 ' + plan.phases.length + ' 个阶段');
  }

  /* 自动播放对话（human / ai 交替，无需点击） */
  function runAuto(steps, done) {
    var i = 0;
    hintEl.textContent = '正在逐项求证（自动进行）……';
    function next() {
      if (i >= steps.length) { hintEl.textContent = ''; done(); return; }
      var s = steps[i++];
      addMsg(s.who, s.text);
      timers.push(setTimeout(next, s.who === 'ai' ? 900 : 580));
    }
    next();
  }
  /* 顺序播放 AI 分析消息（调研后） */
  function runAnalysis(steps, done) {
    var i = 0;
    function next() {
      if (i >= steps.length) { done(); return; }
      addMsg('ai', steps[i++]);
      timers.push(setTimeout(next, 850));
    }
    next();
  }

  function play(node) {
    busy = true;
    optsEl.innerHTML = '';
    hintEl.textContent = 'Career Kit 正在回复……';
    var msgs = typeof node.ai === 'function' ? node.ai() : node.ai;
    var typing = addMsg('ai', '<div class="typing"><i></i><i></i><i></i></div>');
    msgs.forEach(function (m, i) {
      var isLast = i === msgs.length - 1;
      timers.push(setTimeout(function () {
        if (i === 0) typing.remove();
        addMsg('ai', m);
        if (!isLast) return;
        var finish = function () {
          busy = false;
          if (node.picker) showPicker(node.picker);
          else setOpts(node.opts);
        };
        var afterAnalysis = function () {
          if (node.analysis) {
            var a = typeof node.analysis === 'function' ? node.analysis() : node.analysis;
            runAnalysis(a, finish);
          } else {
            finish();
          }
        };
        var afterResearch = function () {
          if (node.research) {
            var items = typeof node.research === 'function' ? node.research() : node.research;
            addResearch(items);
            timers.push(setTimeout(afterAnalysis, 700));
          } else {
            afterAnalysis();
          }
        };
        var afterPlan = function () {
          if (node.plan) {
            var plan = typeof node.plan === 'function' ? node.plan() : node.plan;
            addPlan(plan);
            timers.push(setTimeout(afterResearch, 600));
          } else {
            afterResearch();
          }
        };
        if (node.auto) {
          var steps = typeof node.auto === 'function' ? node.auto() : node.auto;
          runAuto(steps, afterPlan);
        } else {
          afterPlan();
        }
      }, 420 + i * 620));
    });
  }

  /* ---------- 职业地图：按选择实时渲染 ---------- */
  var mapState = { plan: null, done: {}, current: 0 };

  function mapStoreKey() {
    return 'ck-demo-map-' + PICKS.eduKey + '-' + PICKS.expKey + '-' + PICKS.goalKey;
  }
  function loadMapDone() {
    try { return JSON.parse(localStorage.getItem(mapStoreKey()) || '{}'); } catch (e) { return {}; }
  }
  function saveMapDone() {
    try { localStorage.setItem(mapStoreKey(), JSON.stringify(mapState.done)); } catch (e) {}
  }
  function taskKey(pi, ti) { return 'p' + pi + 't' + ti; }

  function renderMap() {
    var plan = roadmapPlan();
    mapState.plan = plan;
    mapState.done = loadMapDone();
    mapSub.textContent = PICKS.edu.title + ' × ' + PICKS.exp.title + ' × ' + PICKS.goal.title;

    var total = 0, done = 0;
    plan.phases.forEach(function (p, pi) {
      p.tasks.forEach(function (t, ti) {
        total += 1;
        if (mapState.done[taskKey(pi, ti)]) done += 1;
      });
    });
    var pct = total ? Math.round(done / total * 100) : 0;

    var tabs = plan.phases.map(function (p, i) {
      return '<button class="m-tab' + (i === mapState.current ? ' active' : '') + '" data-phase="' + i + '">'
        + '阶段 ' + (i + 1) + '</button>';
    }).join('');

    mapBody.innerHTML =
      '<div class="m-sum">'
      + '<div class="m-ring" style="--p:' + pct + '"><span id="m-pct">' + pct + '%</span></div>'
      + '<div class="txt"><b>' + esc(PICKS.goal.target) + '</b><br>'
      + '总进度 ' + done + ' / ' + total + ' 个任务 · 起点档位 ' + startLevel()
      + ' · 匹配度 ' + matchScore() + '/100</div></div>'
      + '<div class="m-strategy">' + esc(plan.strategy) + '</div>'
      + '<div class="m-tabs">' + tabs + '</div>'
      + '<div id="m-phase-view"></div>';

    renderMapPhase();
    mapBody.querySelectorAll('.m-tab').forEach(function (b) {
      b.addEventListener('click', function () {
        mapState.current = parseInt(b.getAttribute('data-phase'), 10);
        mapBody.querySelectorAll('.m-tab').forEach(function (x) { x.classList.remove('active'); });
        b.classList.add('active');
        renderMapPhase();
      });
    });
  }

  function renderMapPhase() {
    var plan = mapState.plan;
    var p = plan.phases[mapState.current] || plan.phases[0];
    var pi = plan.phases.indexOf(p);
    var tasks = p.tasks.map(function (t, ti) {
      var k = taskKey(pi, ti);
      var isDone = !!mapState.done[k];
      var mode = t.mode === 'daily' ? '按天打卡'
        : (t.mode === 'percent' ? '按比例推进' : '按次完成');
      return '<label class="m-task"><input type="checkbox" data-k="' + k + '"'
        + (isDone ? ' checked' : '') + '>'
        + '<span class="tname' + (isDone ? ' done' : '') + '">' + esc(t.name) + '</span>'
        + '<span class="tmode">' + mode + '</span></label>';
    }).join('');
    document.getElementById('m-phase-view').innerHTML =
      '<div class="m-phase">'
      + '<h4>' + esc(p.name) + '</h4>'
      + '<div class="goal">' + esc(p.goal) + '</div>'
      + (p.company ? '<div class="goal">目标单位：' + esc(p.company) + '</div>' : '')
      + '<div class="kpi">KPI：<b>' + esc(p.kpi) + '</b></div>'
      + '<div class="m-tasks">' + tasks + '</div>'
      + '</div>';

    document.querySelectorAll('#m-phase-view input[type=checkbox]').forEach(function (cb) {
      cb.addEventListener('change', function () {
        var k = cb.getAttribute('data-k');
        mapState.done[k] = cb.checked;
        saveMapDone();
        renderMap();
      });
    });
  }

  function revealMap() {
    busy = false;
    chatCard.style.display = 'none';
    mapWrap.style.display = 'block';
    window.scrollTo(0, 0);
    mapState.current = 0;
    renderMap();
  }
  function resetAll() {
    timers.forEach(clearTimeout); timers = [];
    chatEl.innerHTML = '';
    optsEl.innerHTML = '';
    hintEl.textContent = '';
    PICKS = { edu: EDU.ben_cs, exp: EXP.intern_small, goal: GOAL.agent_big,
              eduKey: 'ben_cs', expKey: 'intern_small', goalKey: 'agent_big' };
    mapState = { plan: null, done: {}, current: 0 };
    mapWrap.style.display = 'none';
    chatCard.style.display = 'flex';
    busy = false;
    renderStepper('');
    runNode(0);
  }
  function runNode(idx) {
    var node = S[idx];
    if (!node) return;
    renderStepper(node.stepName);
    if (idx === 13) { revealMap(); return; }
    play(node);
  }
  document.getElementById('restart-btn').addEventListener('click', resetAll);
  document.getElementById('restart-chat').addEventListener('click', function (e) {
    e.preventDefault(); resetAll();
  });
  runNode(0);
})();
</script>
</body>
</html>
