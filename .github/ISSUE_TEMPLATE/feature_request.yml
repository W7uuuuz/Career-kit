name: 功能建议
description: 提出一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先描述问题，而不是直接给方案。清楚的问题比漂亮的方案更有价值。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的具体问题
      description: 谁在什么场景下卡住了？
      placeholder: 作为……我希望……因为……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么解决
      description: 可以是功能、流程或文档改进
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - 建档与档案
        - 数据抓取
        - 差距分析
        - 路线图与任务
        - 求职漏斗与周检视
        - 本地控制台 / 职业地图
        - 文档
        - 其他
