name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 只发布落地页与合成数据的演示 HTML（含对话式体验页与职业地图）。
      # 不上传 ~/CareerKit、~/.career-kit，也不上传任何原始档案 JSON。
      - name: Stage public demo only
        run: |
          mkdir -p site/examples/demo
          cp docs/index.html site/index.html
          cp docs/examples/demo/chat-demo.html site/examples/demo/chat-demo.html
          cp docs/examples/demo/career-map.html site/examples/demo/career-map.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
