[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "career-kit"
version = "0.1.0"
description = "MCP server for AI-powered career planning — profile, gap analysis, roadmap, schedule"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "pydantic>=2.0.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "playwright>=1.40.0",
    "iv8",
    # 反检测 fork，驱动层消除 Runtime.enable 泄漏（BOSS 登录必需）。
    # 必须锁死版本：上游重构可能导致静默失效
    "patchright==1.62.1",
]

[project.scripts]
career-kit = "src.server:main"
career-kit-doctor = "src.doctor:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anthropic>=0.40",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "node_modules", ".opencode", "career-kit-test", "*.egg"]
addopts = "-q"
markers = [
    "e2e: 端到端测试（需要 CAREER_KIT_E2E=1）",
    "e2e_live: 需要真实网络与招聘站点",
    "e2e_browser: 需要 Playwright Chromium",
    "e2e_llm: 需要 ANTHROPIC_API_KEY 与 LLM 端点",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
# 基线规则集：未用导入/变量、未定义名、语法风险、import 排序、现代化与简化建议
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # 行宽交给格式化与 review，HTML f-string 场景误报多
    "SIM108", # 三元改写建议不强制
]

[tool.ruff.lint.isort]
combine-as-imports = true   # 带别名的 import 合并成块，避免装配层被拆散

[tool.ruff.lint.per-file-ignores]
# server.py 是装配层：import 即注册 @mcp.tool()，并向测试 re-export 工具函数
"src/server.py" = ["F401"]
# 测试用 sys.path.insert 引导 src，模块级 import 必然不在顶部；
# assert False / 嵌套 with / 单字母变量是测试常见模式，放宽
"tests/**" = ["E402", "B011", "SIM105", "SIM115", "SIM117", "E741", "C401"]
"tests/e2e/**" = ["E402", "F401", "B011", "SIM105", "SIM115", "SIM117", "E741", "C401"]
