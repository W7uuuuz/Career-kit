[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "career-kit"
version = "0.1.0"
description = "MCP server for AI-powered career planning — profile, gap analysis, roadmap, schedule"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "pydantic>=2.0.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "playwright>=1.40.0",
    "iv8",
    # 反检测 fork，驱动层消除 Runtime.enable 泄漏（BOSS 登录必需）。
    # 必须锁死版本：上游重构可能导致静默失效
    "patchright==1.62.1",
]

[project.scripts]
career-kit = "src.server:main"
career-kit-doctor = "src.doctor:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anthropic>=0.40",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "node_modules", ".opencode", "career-kit-test", "*.egg"]
addopts = "-q"
markers = [
    "e2e: 端到端测试（需要 CAREER_KIT_E2E=1）",
    "e2e_live: 需要真实网络与招聘站点",
    "e2e_browser: 需要 Playwright Chromium",
    "e2e_llm: 需要 ANTHROPIC_API_KEY 与 LLM 端点",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
