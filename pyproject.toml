[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "career-kit"
version = "0.2.3"
description = "AI career coach MCP server: real job-market gap analysis, staged roadmap, check-in tasks, and an application funnel"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = [
    "mcp",
    "model-context-protocol",
    "career",
    "job-search",
    "resume",
    "ai-agent",
    "claude-code",
    "opencode",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Office/Business",
]
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "pydantic>=2.0.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "cryptography>=42.0",
    "playwright>=1.40.0",
    # iv8 只存在于官方 PyPI（国内镜像常缺）；锁定版本避免上游静默变更
    "iv8==0.1.4",
    # 反检测 fork，驱动层消除 Runtime.enable 泄漏（BOSS 登录必需）。
    # 必须锁死版本：上游重构可能导致静默失效
    "patchright==1.62.1",
]

[project.scripts]
career-kit = "src.server:main"
career-kit-doctor = "src.doctor:main"
career-kit-serve = "src.web:main"
career-kit-demo = "src.demo:main"

[project.urls]
Homepage = "https://github.com/W7uuuuz/Career-kit"
Demo = "https://w7uuuuz.github.io/Career-kit/"
Documentation = "https://github.com/W7uuuuz/Career-kit/tree/main/docs"
Repository = "https://github.com/W7uuuuz/Career-kit"
Issues = "https://github.com/W7uuuuz/Career-kit/issues"
Changelog = "https://github.com/W7uuuuz/Career-kit/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anthropic>=0.40",
    "ruff>=0.6",
    "imageio-ffmpeg>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "node_modules", ".opencode", "career-kit-test", "*.egg"]
addopts = "-q"
markers = [
    "e2e: 端到端测试（需要 CAREER_KIT_E2E=1）",
    "e2e_live: 需要真实网络与招聘站点",
    "e2e_browser: 需要 Playwright Chromium",
    "e2e_llm: 需要 ANTHROPIC_API_KEY 与 LLM 端点",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

# 运行期只读取这些文档（resources.py）；不要整目录 force-include docs，
# 否则 4MB+ 的演示 GIF / png / demo html 会一起进包。
# 注意：force-include 优先级高于 exclude，无法用 exclude 排除，只能逐项列出。
[tool.hatch.build.targets.wheel.force-include]
"sop" = "sop"
"docs/README.md" = "docs/README.md"
"docs/llms.txt" = "docs/llms.txt"
"docs/workflow.md" = "docs/workflow.md"
"docs/scrapers.md" = "docs/scrapers.md"
"docs/tools.md" = "docs/tools.md"
"docs/knowledge.md" = "docs/knowledge.md"
"docs/rules.md" = "docs/rules.md"
"docs/install.md" = "docs/install.md"
"docs/industry-outcomes.md" = "docs/industry-outcomes.md"
"docs/examples/README.md" = "docs/examples/README.md"
# career-kit-demo 需要这份自包含演示页
"docs/examples/demo/chat-demo.html" = "docs/examples/demo/chat-demo.html"
"docs/prompts" = "docs/prompts"

[tool.hatch.build.targets.sdist]
# 开发资产与大体积演示素材不随源码包分发；GitHub 仓库仍保留
exclude = [
    ".github/**",
    ".claude/**",
    ".opencode/**",
    "artifacts/**",
    "screenshots/**",
    "site/**",
    # 保留 chat-demo.html（career-kit-demo 用），其余演示素材不进 sdist
    "docs/examples/demo/README.md",
    "docs/examples/demo/dashboard.html",
    "docs/examples/demo/dashboard.png",
    "docs/examples/demo/demo_profile.json",
    "docs/examples/demo/readme-demo.gif",
    "docs/examples/demo/social-preview.html",
    "docs/examples/demo/story.html",
    "docs/examples/data/**",
    "docs/examples/scenarios/**",
    "docs/examples/build_demo.py",
    "docs/examples/record_assets.py",
]

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
# 基线规则集：未用导入/变量、未定义名、语法风险、import 排序、现代化与简化建议
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # 行宽交给格式化与 review，HTML f-string 场景误报多
    "SIM108", # 三元改写建议不强制
]

[tool.ruff.lint.isort]
combine-as-imports = true   # 带别名的 import 合并成块，避免装配层被拆散

[tool.ruff.lint.per-file-ignores]
# server.py 是装配层：import 即注册 @mcp.tool()，并向测试 re-export 工具函数
"src/server.py" = ["F401"]
# 测试用 sys.path.insert 引导 src，模块级 import 必然不在顶部；
# assert False / 嵌套 with / 单字母变量是测试常见模式，放宽
"tests/**" = ["E402", "B011", "SIM105", "SIM115", "SIM117", "E741", "C401"]
"tests/e2e/**" = ["E402", "F401", "B011", "SIM105", "SIM115", "SIM117", "E741", "C401"]
